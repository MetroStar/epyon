name: Epyon Security Scan (Reusable)

# Reusable workflow that can be called from any repository's CI pipeline.
# This allows repos to sequence security scanning after their build/test jobs,
# enabling coverage artifacts to be passed through for SonarQube analysis.
#
# Usage (from caller):
#   jobs:
#     build:
#       runs-on: self-hosted
#       steps: ...  # build, test, upload coverage artifact
#
#     security-scan:
#       needs: build
#       uses: MetroStar/epyon/.github/workflows/epyon-scan.yml@main
#       with:
#         scan_mode: quick
#         coverage_artifact: coverage-xml  # name of artifact from build job
#       secrets: inherit

on:
  workflow_call:
    inputs:
      scan_mode:
        description: 'Scan mode (quick/full/nightly/baseline); nightly=full+LLM (Garak)'
        required: false
        default: 'full'
        type: string
      subdirectory:
        description: 'Optional: Subdirectory path to scan'
        required: false
        default: ''
        type: string
      repository_url:
        description: 'Optional: External repository URL to scan (for public/external scans)'
        required: false
        default: ''
        type: string
      pr_number:
        description: 'Optional: Pull request number to scan (GitHub repos, external scan mode)'
        required: false
        default: ''
        type: string
      target_ref:
        description: 'Optional: Branch/tag/commit to scan (external scan mode)'
        required: false
        default: ''
        type: string
      coverage_artifact:
        description: 'Name of coverage artifact from a prior job (downloaded via gh CLI)'
        required: false
        default: ''
        type: string
      fail_on_critical:
        description: 'Fail build on critical severity findings'
        required: false
        default: true
        type: boolean
      fail_on_high:
        description: 'Fail build on high severity findings'
        required: false
        default: true
        type: boolean
      warning_only:
        description: 'Report vulnerabilities but never fail the build'
        required: false
        default: false
        type: boolean
      garak_target_type:
        description: 'Garak generator type (for example: test, openai, huggingface)'
        required: false
        default: 'openai'
        type: string
      garak_target_name:
        description: 'Garak target model name (for example: test.Blank, gpt-4o-mini)'
        required: false
        default: 'gpt-4o-mini'
        type: string
      garak_probes:
        description: 'Comma-separated Garak probes or probe groups'
        required: false
        default: 'promptinject,dan,knownbadsignatures,encoding,continuation'
        type: string
      skip_garak:
        description: 'Skip Garak LLM security probing (Layer 12)'
        required: false
        default: false
        type: boolean
      run_garak:
        description: 'Explicitly run (true) or skip (false) Garak; when set, overrides skip_garak and event-based defaults'
        required: false
        default: ''
        type: string
      skip_sbom:
        description: 'Skip Layer 1 - SBOM generation'
        required: false
        default: false
        type: boolean
      skip_trufflehog:
        description: 'Skip Layer 2 - Secret detection (TruffleHog)'
        required: false
        default: false
        type: boolean
      skip_sonar:
        description: 'Skip Layer 3 - Code quality (SonarQube)'
        required: false
        default: false
        type: boolean
      skip_clamav:
        description: 'Skip Layer 4 - Malware detection (ClamAV)'
        required: false
        default: false
        type: boolean
      skip_helm:
        description: 'Skip Layer 5 - Helm chart build'
        required: false
        default: false
        type: boolean
      skip_checkov:
        description: 'Skip Layer 6 - Infrastructure security (Checkov)'
        required: false
        default: false
        type: boolean
      skip_trivy:
        description: 'Skip Layer 7 - Container security (Trivy)'
        required: false
        default: false
        type: boolean
      skip_grype:
        description: 'Skip Layer 8 - Vulnerability detection (Grype)'
        required: false
        default: false
        type: boolean
      skip_xeol:
        description: 'Skip Layer 9 - End-of-life detection (Xeol)'
        required: false
        default: false
        type: boolean
      skip_anchore:
        description: 'Skip Layer 10 - Anchore security'
        required: false
        default: false
        type: boolean
      skip_api_discovery:
        description: 'Skip Layer 11 - API discovery'
        required: false
        default: false
        type: boolean
      create_github_issue:
        description: 'Create a GitHub issue for critical and high severity findings'
        required: false
        default: true
        type: boolean
      create_jira_tickets:
        description: 'Create JIRA tickets for critical and high severity findings'
        required: false
        default: false
        type: boolean
      jira_project_key:
        description: 'JIRA project key to create tickets in (e.g. SEC, INFRA)'
        required: false
        default: ''
        type: string
      jira_issue_type:
        description: 'JIRA issue type for created tickets'
        required: false
        default: 'Bug'
        type: string
      pr_base_branch:
        description: 'Base branch to count merged PRs for the metrics chart (default: main)'
        required: false
        default: 'main'
        type: string
      write_metrics:
        description: 'Write and upload a metrics row for this scan'
        required: false
        default: true
        type: boolean
    secrets:
      OPENAI_API_KEY:
        description: 'OpenAI API key for Garak LLM security probing'
        required: false
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for Garak LLM security probing'
        required: false
      JIRA_BASE_URL:
        description: 'Jira Cloud base URL (e.g. https://yourcompany.atlassian.net)'
        required: false
      JIRA_USER_EMAIL:
        description: 'Email address associated with the Jira API token'
        required: false
      JIRA_API_TOKEN:
        description: 'Jira Cloud personal API token'
        required: false
      JIRA_PROJECT_KEY:
        description: 'Jira project key (e.g. SAP, SEC). Takes precedence over the jira_project_key input.'
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-scan:
    name: Run Epyon Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
      issues: write

    env:
      SCAN_MODE: "${{ inputs.scan_mode }}"
      FAIL_ON_CRITICAL: "${{ inputs.fail_on_critical }}"
      FAIL_ON_HIGH: "${{ inputs.fail_on_high }}"
      WARNING_ONLY: "${{ inputs.warning_only }}"
      NOTIFY_USERS: "${{ vars.NOTIFY_USERS }}"
      GARAK_TARGET_TYPE: "${{ inputs.garak_target_type }}"
      GARAK_TARGET_NAME: "${{ inputs.garak_target_name }}"
      GARAK_PROBES: "${{ inputs.garak_probes }}"
      GARAK_TIMEOUT: "300"
      GARAK_GENERATIONS: "5"
      SKIP_GARAK: "${{ inputs.skip_garak }}"
      RUN_GARAK: "${{ inputs.run_garak }}"
      SKIP_SBOM: "${{ inputs.skip_sbom }}"
      SKIP_TRUFFLEHOG: "${{ inputs.skip_trufflehog }}"
      SKIP_SONAR: "${{ inputs.skip_sonar }}"
      SKIP_CLAMAV: "${{ inputs.skip_clamav }}"
      SKIP_HELM: "${{ inputs.skip_helm }}"
      SKIP_CHECKOV: "${{ inputs.skip_checkov }}"
      SKIP_TRIVY: "${{ inputs.skip_trivy }}"
      SKIP_GRYPE: "${{ inputs.skip_grype }}"
      SKIP_XEOL: "${{ inputs.skip_xeol }}"
      SKIP_ANCHORE: "${{ inputs.skip_anchore }}"
      SKIP_API_DISCOVERY: "${{ inputs.skip_api_discovery }}"
      CREATE_GITHUB_ISSUE: "${{ inputs.create_github_issue }}"
      CREATE_JIRA_TICKETS: "${{ inputs.create_jira_tickets }}"
      JIRA_PROJECT_KEY: "${{ secrets.JIRA_PROJECT_KEY || inputs.jira_project_key }}"
      JIRA_ISSUE_TYPE: "${{ inputs.jira_issue_type }}"
      JIRA_BASE_URL: "${{ secrets.JIRA_BASE_URL }}"
      JIRA_USER_EMAIL: "${{ secrets.JIRA_USER_EMAIL }}"
      JIRA_API_TOKEN: "${{ secrets.JIRA_API_TOKEN }}"

    steps:
      - name: Checkout Target Repository
        if: inputs.repository_url == ''
        uses: actions/checkout@v5
        with:
          path: target-repo
          fetch-depth: 0

      - name: Clone External Target Repository
        if: inputs.repository_url != ''
        run: |
          REPO_URL="${{ inputs.repository_url }}"
          SUBDIR="${{ inputs.subdirectory }}"
          PR_NUMBER="${{ inputs.pr_number }}"
          TARGET_REF="${{ inputs.target_ref }}"
          CHECKOUT_TARGET=""

          if [[ -n "$PR_NUMBER" ]]; then
            CHECKOUT_TARGET="refs/pull/${PR_NUMBER}/merge"
            echo "🎯 Targeting PR #$PR_NUMBER ($CHECKOUT_TARGET)"
          elif [[ -n "$TARGET_REF" ]]; then
            CHECKOUT_TARGET="$TARGET_REF"
            echo "🎯 Targeting ref: $TARGET_REF"
          fi

          if [[ -n "$SUBDIR" ]]; then
            echo "📥 Cloning repository with sparse-checkout (subdirectory: $SUBDIR)"
            git clone --filter=blob:none --sparse "$REPO_URL" target-repo
            cd target-repo

            if [[ -n "$CHECKOUT_TARGET" ]]; then
              git fetch origin "$CHECKOUT_TARGET"
              git checkout --detach FETCH_HEAD
            fi

            git sparse-checkout set "$SUBDIR"
            cd ..
          else
            echo "📥 Cloning full repository"
            git clone "$REPO_URL" target-repo
            if [[ -n "$CHECKOUT_TARGET" ]]; then
              cd target-repo
              git fetch origin "$CHECKOUT_TARGET"
              git checkout --detach FETCH_HEAD
              cd ..
            fi
          fi

      - name: Checkout Epyon Security Scanner
        uses: actions/checkout@v5
        with:
          repository: MetroStar/epyon
          path: epyon
          fetch-depth: 1

      - name: Download coverage artifact
        if: inputs.coverage_artifact != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📥 Downloading coverage artifact: ${{ inputs.coverage_artifact }}"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ inputs.coverage_artifact }}" \
            --dir target-repo \
          && echo "✅ Coverage artifact downloaded" \
          || echo "⚠️ Coverage artifact not available — SonarQube will run without coverage data"

          # Rewrite absolute <source> paths in coverage.xml so SonarQube can
          # map them to the checkout directory on this runner.
          if [[ -f target-repo/coverage.xml ]]; then
            CHECKOUT_DIR="${{ github.workspace }}/target-repo"
            echo "🔧 Rewriting coverage.xml source paths → $CHECKOUT_DIR"
            sed -i -E "s|<source>[^<]+</source>|<source>${CHECKOUT_DIR}</source>|g" target-repo/coverage.xml
          fi

      - name: Free Disk Space
        run: |
          echo "📊 Disk usage before cleanup:"
          df -h /
          # Remove large pre-installed toolchains not needed for security scanning
          sudo rm -rf /usr/local/lib/android \
                      /usr/local/share/boost \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup \
                      /usr/lib/jvm \
                      /usr/share/swift \
                      /usr/local/share/chromium \
                      /usr/local/share/powershell \
                      /usr/local/lib/node_modules \
                      /var/lib/snapd 2>/dev/null || true
          sudo apt-get clean
          docker image prune -af --filter "until=1h" 2>/dev/null || true
          echo "📊 Disk usage after cleanup:"
          df -h /

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker Images
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Pull Security Tool Images
        run: |
          # Pull images sequentially to avoid racing for disk space.
          # dhi.io images require authentication — skip if not available.
          for image in \
            anchore/grype:latest \
            ghcr.io/aquasecurity/trivy:latest \
            trufflesecurity/trufflehog:latest \
            anchore/syft:latest \
            clamav/clamav:latest \
            bridgecrew/checkov:latest \
            noqcks/xeol:latest; do
            echo "⏬ Pulling $image..."
            docker pull "$image" || echo "⚠️  Failed to pull $image — will be pulled on demand or skipped"
          done
          echo "✅ Security tool images ready"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-pip bats
          pip3 install pyyaml pipdeptree

      - name: Initialize Scan
        id: init-scan
        env:
          TARGET_NAME: ${{ github.event.repository.name }}
          GITHUB_ACTOR: ${{ github.actor }}
          SUBDIR: ${{ inputs.subdirectory }}
          REPOSITORY_URL_INPUT: ${{ inputs.repository_url }}
        run: |
          cd epyon
          chmod +x scripts/shell/run-target-security-scan.sh

          EPYON_VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo "unknown")
          echo "Using Epyon version: $EPYON_VERSION"

          TARGET_NAME_DEFAULT="$TARGET_NAME"
          if [[ -n "$REPOSITORY_URL_INPUT" ]]; then
            TARGET_NAME_DEFAULT=$(basename "$REPOSITORY_URL_INPUT" .git)
          fi

          if [[ -n "$SUBDIR" ]]; then
            TARGET_DIR="${{ github.workspace }}/target-repo/$SUBDIR"
            TARGET_NAME=$(basename "$SUBDIR")
            echo "🎯 Scanning subdirectory: $SUBDIR"
          else
            TARGET_DIR="${{ github.workspace }}/target-repo"
            TARGET_NAME="$TARGET_NAME_DEFAULT"
            echo "🎯 Scanning full repository: $TARGET_NAME"
          fi

          echo "TARGET_DIR=$TARGET_DIR" > /tmp/epyon-env
          echo "SCAN_MODE=$SCAN_MODE" >> /tmp/epyon-env
          echo "TARGET_NAME=$TARGET_NAME" >> /tmp/epyon-env
          echo "GITHUB_ACTOR=$GITHUB_ACTOR" >> /tmp/epyon-env
          echo "SUBDIR=$SUBDIR" >> /tmp/epyon-env
          echo "EPYON_VERSION=$EPYON_VERSION" >> /tmp/epyon-env
          echo "GARAK_TARGET_TYPE=${GARAK_TARGET_TYPE:-openai}" >> /tmp/epyon-env
          echo "GARAK_TARGET_NAME=${GARAK_TARGET_NAME:-gpt-4o-mini}" >> /tmp/epyon-env
          echo "GARAK_PROBES=${GARAK_PROBES:-promptinject,dan,knownbadsignatures,encoding,continuation}" >> /tmp/epyon-env

          # Per-tool skip flags
          echo "SKIP_SBOM=${SKIP_SBOM:-false}" >> /tmp/epyon-env
          echo "SKIP_TRUFFLEHOG=${SKIP_TRUFFLEHOG:-false}" >> /tmp/epyon-env
          echo "SKIP_SONAR=${SKIP_SONAR:-false}" >> /tmp/epyon-env
          echo "SKIP_CLAMAV=${SKIP_CLAMAV:-false}" >> /tmp/epyon-env
          echo "SKIP_HELM=${SKIP_HELM:-false}" >> /tmp/epyon-env
          echo "SKIP_CHECKOV=${SKIP_CHECKOV:-false}" >> /tmp/epyon-env
          echo "SKIP_TRIVY=${SKIP_TRIVY:-false}" >> /tmp/epyon-env
          echo "SKIP_GRYPE=${SKIP_GRYPE:-false}" >> /tmp/epyon-env
          echo "SKIP_XEOL=${SKIP_XEOL:-false}" >> /tmp/epyon-env
          echo "SKIP_ANCHORE=${SKIP_ANCHORE:-false}" >> /tmp/epyon-env
          echo "SKIP_API_DISCOVERY=${SKIP_API_DISCOVERY:-false}" >> /tmp/epyon-env

          # Propagate RUN_GARAK to SKIP_GARAK for legacy consumers; run_garak_layer reads RUN_GARAK directly.
          if [[ "${RUN_GARAK}" == "true" ]];  then echo "SKIP_GARAK=false" >> "$GITHUB_ENV"; fi
          if [[ "${RUN_GARAK}" == "false" ]]; then echo "SKIP_GARAK=true"  >> "$GITHUB_ENV"; fi

          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          USERNAME="${GITHUB_ACTOR}"
          SCAN_NAME="${TARGET_NAME}_${USERNAME}_${TIMESTAMP}"
          SCAN_DIR="scans/${SCAN_NAME}"
          mkdir -p "$SCAN_DIR"
          echo "SCAN_DIR=$PWD/$SCAN_DIR" >> /tmp/epyon-env
          echo "SCAN_NAME=$SCAN_NAME" >> /tmp/epyon-env
          echo "SCAN_ID=$SCAN_NAME" >> /tmp/epyon-env
          echo "scan_dir=$SCAN_DIR" >> $GITHUB_OUTPUT
          echo "scan_id=$SCAN_NAME" >> $GITHUB_OUTPUT
          echo "🚀 Initialized scan: $SCAN_NAME"

      - name: Free Disk Space (pre-scan)
        if: always()
        run: |
          # Prune Docker resources that are no longer needed after image pull.
          # This typically recovers 8-15 GB on ubuntu-latest before Layer 12
          # (Garak) attempts to install torch + transformers (~2 GB unpacked).
          echo "Disk before cleanup:"
          df -h / | tail -1
          docker image prune -af  2>/dev/null || true
          docker container prune -f 2>/dev/null || true
          docker volume prune -f  2>/dev/null || true
          docker builder prune -af 2>/dev/null || true
          # Clear pip wheel cache so large cached wheels don't consume space twice.
          python3 -m pip cache purge 2>/dev/null || true
          echo "Disk after cleanup:"
          df -h / | tail -1

      - name: Run Security Layers (CI Orchestrator)
        id: run-scan
        continue-on-error: true
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Append API keys to /tmp/epyon-env so they are explicitly exported to all subshells.
          [[ -n "${OPENAI_API_KEY:-}" ]]    && echo "OPENAI_API_KEY=${OPENAI_API_KEY}"       >> /tmp/epyon-env
          [[ -n "${ANTHROPIC_API_KEY:-}" ]] && echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}" >> /tmp/epyon-env
          chmod +x epyon/scripts/shell/run-epyon-scan-ci.sh
          ./epyon/scripts/shell/run-epyon-scan-ci.sh

      - name: Check Severity Gate
        run: |
          cd epyon
          if [ -f /tmp/epyon-env ]; then
            set -a
            source /tmp/epyon-env
            set +a
          fi
          export FAIL_ON_CRITICAL="${{ env.FAIL_ON_CRITICAL }}"
          export FAIL_ON_HIGH="${{ env.FAIL_ON_HIGH }}"
          export WARNING_ONLY="${{ env.WARNING_ONLY }}"
          chmod +x scripts/shell/check-severity-gate.sh
          ./scripts/shell/check-severity-gate.sh

      - name: Generate Reports & Dashboard
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd epyon
          if [ -f /tmp/epyon-env ]; then
            source /tmp/epyon-env
          fi
          SCAN_DIR="${{ steps.run-scan.outputs.scan_dir }}"
          echo "📊 Generating consolidated reports and dashboard..."
          echo "DEBUG: SCAN_DIR = $SCAN_DIR"
          echo "DEBUG: Before consolidation, manifest files:"
          ls -la "$SCAN_DIR"/scan-manifest* "$SCAN_DIR"/manifest-summary* 2>&1 || echo "Manifest files not found before consolidation!"
          chmod +x scripts/shell/consolidate-security-reports.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="$TARGET_DIR" ./scripts/shell/consolidate-security-reports.sh || echo "Report generation completed with warnings"
          echo "DEBUG: After consolidation, manifest files in consolidated-reports:"
          ls -la "$SCAN_DIR/consolidated-reports"/scan-manifest* "$SCAN_DIR/consolidated-reports"/manifest-summary* 2>&1 || echo "Manifest files not found in consolidated-reports!"

          # ─── Embed 90-day metrics trend into dashboard ────────────────────
          DASHBOARD_FILE="$SCAN_DIR/consolidated-reports/dashboards/security-dashboard.html"
          METRICS_90D_FILE="$SCAN_DIR/scan-metrics-90d.json"

          if [ -f "$DASHBOARD_FILE" ]; then
            echo "📈 Adding 90-day metrics trend to dashboard..."
            echo "${GH_TOKEN}" | gh auth login --with-token >/dev/null 2>&1 || true
            SINCE_DATE=$(date -u -d '90 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-90d +%Y-%m-%d)
            echo "Looking for scans since: $SINCE_DATE"

            chmod +x scripts/shell/get-scan-metrics.sh scripts/shell/embed-metrics-in-dashboard.sh

            # Collect metrics (without --quiet so we see what was found)
            if ./scripts/shell/get-scan-metrics.sh \
              --github-only \
              --from-github "${{ github.repository }}" \
              --since "$SINCE_DATE" \
              --output "$METRICS_90D_FILE"; then
              echo "✅ Metrics collected successfully"
            else
              echo "⚠️ Metrics aggregation completed with warnings (see above)"
            fi

            if [ -s "$METRICS_90D_FILE" ]; then
              # Resolve base branch: use input override if set, otherwise auto-detect from repo API
              PR_REPO="${{ inputs.repository_url || github.repository }}"
              PR_REPO=$(echo "$PR_REPO" | sed 's|https://github.com/||; s|/$||')
              OVERRIDE_BRANCH="${{ inputs.pr_base_branch }}"
              if [ -n "$OVERRIDE_BRANCH" ]; then
                PR_BASE_BRANCH="$OVERRIDE_BRANCH"
              else
                PR_BASE_BRANCH=$(gh api "repos/${PR_REPO}" --jq '.default_branch' 2>/dev/null || echo "main")
              fi
              echo "📊 Counting PRs merged to: ${PR_BASE_BRANCH} (repo: ${PR_REPO})"
              ./scripts/shell/embed-metrics-in-dashboard.sh \
                --metrics "$METRICS_90D_FILE" \
                --dashboard "$DASHBOARD_FILE" \
                --chart-type bar \
                --max-points 90 \
                --pr-repo "$PR_REPO" \
                --pr-base-branch "$PR_BASE_BRANCH" \
                --pr-since "$SINCE_DATE" \
                || echo "⚠️ Dashboard metrics embedding completed with warnings"
              echo "✅ Metrics embedding step completed"
            else
              echo "⚠️ No metrics data available for embedding"
            fi
          fi

      - name: Fix Artifact Permissions
        if: always()
        run: |
          cd epyon
          SCAN_DIR="${{ steps.run-scan.outputs.scan_dir }}"
          if [ -d "$SCAN_DIR" ]; then
            echo "Fixing permissions for: $SCAN_DIR"
            sudo chown -R runner:docker "$SCAN_DIR" || true
            sudo chmod -R a+r "$SCAN_DIR" || true
            sudo find "$SCAN_DIR" -type d -exec chmod a+rx {} \; || true
            ls -la "$SCAN_DIR/clamav/" || true
          fi

      - name: Generate Summary
        if: always()
        run: |
          cd epyon
          if [ -f /tmp/epyon-env ]; then
            source /tmp/epyon-env
          fi
          SCAN_DIR="${{ steps.run-scan.outputs.scan_dir }}"
          GARAK_RESULTS_FILE="$SCAN_DIR/garak/garak-results.json"

          echo "**Epyon Version:** \`${EPYON_VERSION:-unknown}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🤖 Garak LLM Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f "$GARAK_RESULTS_FILE" ]; then
            GARAK_STATUS=$(jq -r '.status // "unknown"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "unknown")
            GARAK_TARGET_TYPE=$(jq -r '.target_type // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_TARGET_NAME=$(jq -r '.target_name // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_RUNTIME_TARGET=$(jq -r '.runtime_target // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_RUNTIME_CLASSIFICATION=$(jq -r '.runtime_classification // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_TARGET_ORIGIN=$(jq -r '.target_origin // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_PROBES=$(jq -r '.probes // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_EXIT_CODE=$(jq -r '.exit_code // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_HIT_LOG=$(jq -r '.hit_log // empty' "$GARAK_RESULTS_FILE" 2>/dev/null || true)
            GARAK_HIT_COUNT="0"
            if [ -n "$GARAK_HIT_LOG" ] && [ -f "$SCAN_DIR/garak/$GARAK_HIT_LOG" ]; then
              GARAK_HIT_COUNT=$(wc -l < "$SCAN_DIR/garak/$GARAK_HIT_LOG" | tr -d '[:space:]')
            fi
            echo "- Status: \`$GARAK_STATUS\`" >> $GITHUB_STEP_SUMMARY
            echo "- Target: \`$GARAK_TARGET_TYPE\` / \`$GARAK_TARGET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- Runtime target: \`$GARAK_RUNTIME_TARGET\`" >> $GITHUB_STEP_SUMMARY
            echo "- Runtime class: \`$GARAK_RUNTIME_CLASSIFICATION\`" >> $GITHUB_STEP_SUMMARY
            echo "- Target origin: \`$GARAK_TARGET_ORIGIN\`" >> $GITHUB_STEP_SUMMARY
            echo "- Probes: \`$GARAK_PROBES\`" >> $GITHUB_STEP_SUMMARY
            echo "- Probe hits: \`$GARAK_HIT_COUNT\`" >> $GITHUB_STEP_SUMMARY
            echo "- Exit code: \`$GARAK_EXIT_CODE\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Garak results were not generated in this run." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md" ]; then
            cat "$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Write Metrics Row
        if: always() && inputs.write_metrics != false && (inputs.scan_mode == 'nightly' || github.event_name == 'workflow_dispatch')
        run: |
          cd epyon
          SCAN_DIR="${{ steps.run-scan.outputs.scan_dir }}"
          FINDINGS_JSON="$SCAN_DIR/security-findings-summary.json"

          CRITICAL=0; HIGH=0; MEDIUM=0; LOW=0
          HAS_FINDINGS=false
          if [ -f "$FINDINGS_JSON" ]; then
            HAS_FINDINGS=true
            CRITICAL=$(jq -r '.summary.total_critical // 0' "$FINDINGS_JSON" 2>/dev/null || echo 0)
            HIGH=$(jq -r     '.summary.total_high     // 0' "$FINDINGS_JSON" 2>/dev/null || echo 0)
            MEDIUM=$(jq -r   '.summary.total_medium   // 0' "$FINDINGS_JSON" 2>/dev/null || echo 0)
            LOW=$(jq -r      '.summary.total_low      // 0' "$FINDINGS_JSON" 2>/dev/null || echo 0)
          fi

          jq -cn \
            --arg  scan_id        "${{ steps.run-scan.outputs.scan_id }}" \
            --arg  target_name    "${{ inputs.repository_url || github.repository }}" \
            --arg  scan_type      "${{ inputs.scan_mode }}" \
            --arg  scan_user      "${{ github.actor }}" \
            --arg  scan_timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg  repository     "${{ github.repository }}" \
            --arg  run_id         "${{ github.run_id }}" \
            --arg  run_url        "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson critical    "$CRITICAL" \
            --argjson high        "$HIGH" \
            --argjson medium      "$MEDIUM" \
            --argjson low         "$LOW" \
            --argjson has_findings "$HAS_FINDINGS" \
            '{
              scan_id:             $scan_id,
              target_name:         $target_name,
              scan_type:           $scan_type,
              scan_user:           $scan_user,
              scan_timestamp:      $scan_timestamp,
              repository:          $repository,
              run_id:              $run_id,
              run_url:             $run_url,
              has_findings_summary:$has_findings,
              critical:            $critical,
              high:                $high,
              medium:              $medium,
              low:                 $low
            }' > "$SCAN_DIR/scan-metrics.json"

      - name: Enrich Findings with NVD + CISA KEV
        if: always()
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SCAN_DIR: ${{ steps.run-scan.outputs.scan_dir }}
        run: |
          cd epyon
          chmod +x scripts/shell/enrich-findings.sh
          scripts/shell/enrich-findings.sh || true

      - name: Upload Complete Scan Results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ${{ steps.run-scan.outputs.scan_id }}
          path: epyon/${{ steps.run-scan.outputs.scan_dir }}/
          retention-days: 30

      - name: Upload Metrics Row
        uses: actions/upload-artifact@v5
        if: always() && inputs.write_metrics != false && (inputs.scan_mode == 'nightly' || github.event_name == 'workflow_dispatch')
        with:
          name: metrics-${{ steps.run-scan.outputs.scan_id }}
          path: epyon/${{ steps.run-scan.outputs.scan_dir }}/scan-metrics.json
          if-no-files-found: warn
          retention-days: 90

      - name: Check for Critical/High Vulnerabilities
        id: check-severity
        if: always()
        run: |
          cd epyon
          SCAN_DIR="${{ steps.run-scan.outputs.scan_dir }}"

          # Default outputs — always written so downstream steps are never skipped due to empty outputs
          CRITICAL=0
          HIGH=0
          MEDIUM=0
          LOW=0

          # Prefer the deduplicated JSON summary (most reliable source)
          FINDINGS_JSON="$SCAN_DIR/security-findings-summary.json"
          if [ -f "$FINDINGS_JSON" ]; then
            CRITICAL=$(jq -r '.summary.total_critical // 0' "$FINDINGS_JSON")
            HIGH=$(jq -r '.summary.total_high // 0' "$FINDINGS_JSON")
            MEDIUM=$(jq -r '.summary.total_medium // 0' "$FINDINGS_JSON")
            LOW=$(jq -r '.summary.total_low // 0' "$FINDINGS_JSON")
            echo "DEBUG: Read from security-findings-summary.json — Critical=$CRITICAL High=$HIGH Medium=$MEDIUM Low=$LOW"
          else
            # Fall back to executive-summary.md
            SUMMARY="$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md"
            if [ -f "$SUMMARY" ]; then
              CRITICAL=$(grep -oP 'Critical:\s*\K\d+' "$SUMMARY" | head -1 || echo "0")
              HIGH=$(grep -oP 'High:\s*\K\d+' "$SUMMARY" | head -1 || echo "0")
              MEDIUM=$(grep -oP 'Medium:\s*\K\d+' "$SUMMARY" | head -1 || echo "0")
              LOW=$(grep -oP 'Low:\s*\K\d+' "$SUMMARY" | head -1 || echo "0")
              CRITICAL=${CRITICAL:-0}
              HIGH=${HIGH:-0}
              MEDIUM=${MEDIUM:-0}
              LOW=${LOW:-0}
              echo "DEBUG: Read from executive-summary.md — Critical=$CRITICAL High=$HIGH Medium=$MEDIUM Low=$LOW"
            else
              echo "WARNING: Neither security-findings-summary.json nor executive-summary.md found in $SCAN_DIR"
              echo "DEBUG: Contents of $SCAN_DIR:"
              ls -la "$SCAN_DIR" 2>/dev/null || echo "(directory not found)"
            fi
          fi

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT

          if [ "${CRITICAL:-0}" -gt 0 ] || [ "${HIGH:-0}" -gt 0 ] || [ "${MEDIUM:-0}" -gt 0 ] || [ "${LOW:-0}" -gt 0 ]; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'epyon/${{ steps.run-scan.outputs.scan_dir }}/consolidated-reports/markdown-reports/executive-summary.md';

            if (fs.existsSync(summaryPath)) {
              const summary = fs.readFileSync(summaryPath, 'utf8');
              const critical = parseInt('${{ steps.check-severity.outputs.critical }}' || '0');
              const high = parseInt('${{ steps.check-severity.outputs.high }}' || '0');
              const medium = parseInt('${{ steps.check-severity.outputs.medium }}' || '0');
              const low = parseInt('${{ steps.check-severity.outputs.low }}' || '0');

              let emoji = '✅';
              let status = 'No security issues found';

              if (critical > 0 || high > 0) {
                emoji = '⚠️';
                status = `Found ${critical} critical and ${high} high severity issues`;
              } else if (medium > 0 || low > 0) {
                emoji = '🟡';
                status = `Found ${medium} medium and ${low} low severity issues`;
              }

              const notifyUsers = '${{ env.NOTIFY_USERS }}'.split(',').map(u => `@${u.trim()}`).join(' ');

              // Build skipped-scans list from SKIP_* env vars
              const skipMap = {
                'Garak LLM':      '${{ env.SKIP_GARAK }}' === 'true',
                'SBOM':           '${{ env.SKIP_SBOM }}' === 'true',
                'TruffleHog':     '${{ env.SKIP_TRUFFLEHOG }}' === 'true',
                'SonarQube':      '${{ env.SKIP_SONAR }}' === 'true',
                'ClamAV':         '${{ env.SKIP_CLAMAV }}' === 'true',
                'Helm':           '${{ env.SKIP_HELM }}' === 'true',
                'Checkov':        '${{ env.SKIP_CHECKOV }}' === 'true',
                'Trivy':          '${{ env.SKIP_TRIVY }}' === 'true',
                'Grype':          '${{ env.SKIP_GRYPE }}' === 'true',
                'Xeol':           '${{ env.SKIP_XEOL }}' === 'true',
                'Anchore':        '${{ env.SKIP_ANCHORE }}' === 'true',
                'API Discovery':  '${{ env.SKIP_API_DISCOVERY }}' === 'true',
              };
              const skippedScans = Object.entries(skipMap).filter(([,v]) => v).map(([k]) => k);
              const skippedSection = skippedScans.length > 0
                ? `\n> ⏭️ **Skipped scans:** ${skippedScans.join(', ')}\n`
                : '';

              const comment = `## ${emoji} Epyon Security Scan Results

              ${status}
              ${skippedSection}
              **Triggered by:** @${{ github.actor }}
              **Notifying:** ${notifyUsers}

              <details>
              <summary>📊 Executive Summary</summary>

              ${summary}

              </details>

              ### 📦 Artifacts
              - [Security Dashboard](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              - [HTML Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              - [Markdown Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      - name: Create Scan Notification Issue
        id: create-github-issue
        if: always() && steps.check-severity.outputs.has_issues == 'true' && env.CREATE_GITHUB_ISSUE != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const notifyUsers = '${{ env.NOTIFY_USERS }}'.split(',').map(u => `@${u.trim()}`).join(' ');
            const triggeredBy = '@${{ github.actor }}';
            const repository = '${{ github.repository }}';
            const scanMode = '${{ env.SCAN_MODE }}';
            const runUrl = `https://github.com/${repository}/actions/runs/${{ github.run_id }}`;
            const critical = '${{ steps.check-severity.outputs.critical }}' || '0';
            const high = '${{ steps.check-severity.outputs.high }}' || '0';
            const medium = '${{ steps.check-severity.outputs.medium }}' || '0';
            const low = '${{ steps.check-severity.outputs.low }}' || '0';

            let triggerType = 'Manual';
            if ('${{ github.event_name }}' === 'push') triggerType = 'Push to ${{ github.ref_name }}';
            else if ('${{ github.event_name }}' === 'pull_request') triggerType = 'Pull Request #${{ github.event.pull_request.number }}';
            else if ('${{ github.event_name }}' === 'schedule') triggerType = 'Scheduled Scan';

            let severityEmoji = '✅';
            let severityStatus = 'Clean';
            let labels = ['security-scan', 'epyon'];

            const hasCritical = parseInt(critical) > 0;
            const hasHigh = parseInt(high) > 0;
            const hasMedium = parseInt(medium) > 0;
            const hasLow = parseInt(low) > 0;

            if (hasCritical) {
              severityEmoji = '🔴';
              severityStatus = 'Critical Issues Found';
              labels.push('critical', 'security');
            } else if (hasHigh) {
              severityEmoji = '🟠';
              severityStatus = 'High Risk';
              labels.push('high-severity', 'security');
            } else if (hasMedium) {
              severityEmoji = '🟡';
              severityStatus = 'Medium Risk';
              labels.push('medium-severity', 'security');
            } else if (hasLow) {
              severityEmoji = '🔵';
              severityStatus = 'Low Risk';
              labels.push('low-severity', 'security');
            } else {
              labels.push('no-issues');
            }

            const summaryPath = 'epyon/${{ steps.run-scan.outputs.scan_dir }}/consolidated-reports/markdown-reports/executive-summary.md';
            let executiveSummary = '';
            if (fs.existsSync(summaryPath)) {
              executiveSummary = fs.readFileSync(summaryPath, 'utf8');
            }

            const issueBody = `${severityEmoji} **Security Scan Complete - ${severityStatus}**

            **Repository:** \`${repository}\`
            **Scan Mode:** \`${scanMode}\`
            **Trigger:** ${triggerType}
            **Triggered by:** ${triggeredBy}
            **Notifying:** ${notifyUsers}

            ---

            ### 📊 Security Findings Summary

            | Severity | Count |
            |----------|-------|
            | 🔴 Critical | ${critical} |
            | 🟠 High | ${high} |
            | 🟡 Medium | ${medium} |
            | 🔵 Low | ${low} |

            ${executiveSummary ? `\n### 📋 Executive Summary\n\n${executiveSummary}\n` : ''}

            ---

            ### 📦 Scan Artifacts

            - [View Workflow Run](${runUrl})
            - [Download Security Dashboard](${runUrl})
            - [Download Full Report](${runUrl})

            ### 🔗 Next Steps

            ${parseInt(critical) > 0 || parseInt(high) > 0 ?
              '1. ⚠️ **Review critical and high-severity findings immediately**\n2. Download the interactive security dashboard\n3. Prioritize remediation based on severity\n4. Update dependencies and configurations as needed' :
              '1. ✅ Review scan results for informational findings\n2. Monitor for new vulnerabilities\n3. Keep dependencies up to date'}

            ---
            *🤖 Automated notification from Epyon Security Scanner*
            `;

            // Dedup: if an open issue with the same severity label already exists, add a
            // comment with the latest findings instead of creating a duplicate.
            const dedupLabel = hasCritical ? 'critical'
                             : hasHigh     ? 'high-severity'
                             : hasMedium   ? 'medium-severity'
                             : hasLow      ? 'low-severity'
                             :               'no-issues';
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: `security-scan,epyon,${dedupLabel}`,
              per_page: 1
            });
            if (existingIssues.data.length > 0) {
              const existing = existingIssues.data[0];
              console.log(`Open issue already exists (#${existing.number}): ${existing.html_url}`);

              // Parse counts from the most recent bot comment (or the issue body) so we
              // only comment when the vulnerability counts have actually changed.
              const countPattern = /Critical \|\s*(\d+)[\s\S]*?High \|\s*(\d+)[\s\S]*?Medium \|\s*(\d+)[\s\S]*?Low \|\s*(\d+)/;

              let prevCritical = -1, prevHigh = -1, prevMedium = -1, prevLow = -1;

              // Check the most recent bot comment first, then fall back to the issue body.
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                per_page: 100
              });
              const botComments = comments.data.filter(c => c.user.type === 'Bot').reverse();
              const lastSource = botComments.length > 0 ? botComments[0].body : existing.body;
              const match = lastSource && lastSource.match(countPattern);
              if (match) {
                prevCritical = parseInt(match[1]);
                prevHigh     = parseInt(match[2]);
                prevMedium   = parseInt(match[3]);
                prevLow      = parseInt(match[4]);
              }

              const curCritical = parseInt(critical);
              const curHigh     = parseInt(high);
              const curMedium   = parseInt(medium);
              const curLow      = parseInt(low);

              if (curCritical === prevCritical && curHigh === prevHigh &&
                  curMedium === prevMedium && curLow === prevLow) {
                console.log(`Counts unchanged (C:${curCritical} H:${curHigh} M:${curMedium} L:${curLow}) — skipping comment`);
                core.setOutput('issue_number', String(existing.number));
                core.setOutput('issue_url', existing.html_url);
                return;
              }

              console.log(`Counts changed — adding update comment (was C:${prevCritical} H:${prevHigh} M:${prevMedium} L:${prevLow}, now C:${curCritical} H:${curHigh} M:${curMedium} L:${curLow})`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `### 🔄 Updated scan findings — ${new Date().toISOString().split('T')[0]}\n\n${issueBody}`
              });
              core.setOutput('issue_number', String(existing.number));
              core.setOutput('issue_url', existing.html_url);
              return;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${severityEmoji} Security Scan: ${repository.split('/')[1]} - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: labels
            });

            console.log(`Created issue #${issue.data.number}: ${issue.data.html_url}`);
            core.setOutput('issue_number', String(issue.data.number));
            core.setOutput('issue_url', issue.data.html_url);

      - name: Create JIRA Tickets for Critical/High Findings
        if: >
          always() &&
          env.CREATE_JIRA_TICKETS == 'true' &&
          steps.check-severity.outputs.has_issues == 'true' &&
          env.JIRA_BASE_URL != '' &&
          env.JIRA_API_TOKEN != ''
        shell: bash
        env:
          GITHUB_ISSUE_URL: ${{ steps.create-github-issue.outputs.issue_url }}
          GITHUB_ISSUE_NUMBER: ${{ steps.create-github-issue.outputs.issue_number }}
        run: |
          set -euo pipefail

          SCAN_DIR="${{ steps.run-scan.outputs.scan_dir }}"
          FINDINGS_FILE="epyon/${SCAN_DIR}/security-findings-summary.json"
          JIRA_URL="${JIRA_BASE_URL}"
          PROJECT_KEY="${JIRA_PROJECT_KEY}"
          ISSUE_TYPE="${JIRA_ISSUE_TYPE:-Bug}"
          AUTH=$(echo -n "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" | base64 -w0)
          REPO_NAME="${{ github.repository }}"
          REPO_SLUG=$(echo "${REPO_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          TODAY=$(date -u +"%Y-%m-%d")
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "=== JIRA Ticket Creation ==="
          echo "Project: ${PROJECT_KEY} | Repo slug: ${REPO_SLUG}"

          # ── Helper: build an Atlassian Document Format (ADF) paragraph text node ──
          adf_text() { jq -n --arg t "$1" '{type:"text",text:$t}'; }

          # ── Verify auth and project access before attempting any ticket ops ──
          echo "--- Verifying JIRA connectivity and project access ---"
          auth_http=$(curl -s -o /tmp/jira_myself.json -w "%{http_code}" \
            -H "Authorization: Basic ${AUTH}" \
            -H "Accept: application/json" \
            "${JIRA_URL}/rest/api/3/myself")
          if [[ "${auth_http}" != "200" ]]; then
            echo "❌ JIRA authentication failed (HTTP ${auth_http}). Check JIRA_BASE_URL, JIRA_USER_EMAIL, and JIRA_API_TOKEN secrets."
            echo "Response: $(cat /tmp/jira_myself.json)"
            exit 1
          fi
          echo "✅ JIRA auth OK"

          proj_http=$(curl -s -o /tmp/jira_project.json -w "%{http_code}" \
            -H "Authorization: Basic ${AUTH}" \
            -H "Accept: application/json" \
            "${JIRA_URL}/rest/api/3/project/${PROJECT_KEY}")
          if [[ "${proj_http}" != "200" ]]; then
            echo "❌ JIRA project '${PROJECT_KEY}' not found or not accessible (HTTP ${proj_http})."
            echo "Response: $(cat /tmp/jira_project.json)"
            exit 1
          fi
          echo "✅ JIRA project '${PROJECT_KEY}' accessible"

          # ── Helper: search for an existing open JIRA ticket by label ──
          jira_search_open() {
            local label="$1"
            local jql="project = \"${PROJECT_KEY}\" AND labels = \"${label}\" AND labels = \"${REPO_SLUG}\" AND resolution = Unresolved"
            local encoded_jql
            encoded_jql=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${jql}")
            curl -s -o /tmp/jira_search.json -w "%{http_code}" \
              -H "Authorization: Basic ${AUTH}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              "${JIRA_URL}/rest/api/3/issue/search?jql=${encoded_jql}&maxResults=1"
          }

          # ── Helper: build ADF body from a severity section of findings JSON ──
          build_adf_body() {
            local severity_key="$1"  # critical_findings or high_findings
            local summary_line="$2"
            python3 - "${FINDINGS_FILE}" "${severity_key}" "${summary_line}" "${RUN_URL}" "${REPO_NAME}" <<'PYEOF'
          import json, sys

          findings_file, severity_key, summary_line, run_url, repo_name = sys.argv[1:6]

          with open(findings_file) as f:
              data = json.load(f)

          findings = data.get(severity_key, [])

          # Build table rows + collect KEV findings for panel
          rows = []
          kev_findings = []
          for finding in findings:
              vuln_id = (finding.get("vulnerability_id") or finding.get("check_id")
                         or finding.get("detector") or "N/A")
              pkg     = (finding.get("package_name") or finding.get("file_path")
                         or finding.get("file") or "N/A")
              version = finding.get("package_version") or "-"
              tool    = finding.get("tool") or "N/A"
              desc    = (finding.get("description") or "")[:120]
              nvd_url = finding.get("nvd_url") or ""
              is_kev  = finding.get("cisa_kev") is True
              rows.append({"id": vuln_id, "pkg": pkg, "ver": version, "tool": tool,
                           "desc": desc, "nvd_url": nvd_url, "is_kev": is_kev})
              if is_kev:
                  kev_findings.append({
                      "id": vuln_id,
                      "due_date": finding.get("cisa_due_date") or "N/A",
                      "required_action": (finding.get("cisa_required_action") or "")[:200],
                      "ransomware": finding.get("cisa_known_ransomware") is True,
                  })

          def cell_text(text):
              return {
                  "type": "tableCell",
                  "attrs": {},
                  "content": [{"type": "paragraph", "content": [
                      {"type": "text", "text": str(text)[:200]}
                  ]}]
              }

          def cell_link(text, url):
              if url:
                  return {
                      "type": "tableCell",
                      "attrs": {},
                      "content": [{"type": "paragraph", "content": [
                          {"type": "text", "text": str(text)[:200],
                           "marks": [{"type": "link", "attrs": {"href": url}}]}
                      ]}]
                  }
              return cell_text(text)

          def header_cell(text):
              return {
                  "type": "tableHeader",
                  "attrs": {},
                  "content": [{"type": "paragraph", "content": [
                      {"type": "text", "text": str(text), "marks": [{"type": "strong"}]}
                  ]}]
              }

          header_row = {
              "type": "tableRow",
              "content": [header_cell(h) for h in ["ID / CVE", "Package / File", "Version", "Tool", "Description"]]
          }

          data_rows = []
          for r in rows:
              kev_prefix = "🔥 " if r["is_kev"] else ""
              id_cell = cell_link(kev_prefix + r["id"], r["nvd_url"]) if r["nvd_url"] else cell_text(kev_prefix + r["id"])
              data_rows.append({
                  "type": "tableRow",
                  "content": [id_cell, cell_text(r["pkg"]), cell_text(r["ver"]),
                               cell_text(r["tool"]), cell_text(r["desc"])]
              })

          table = {
              "type": "table",
              "attrs": {"isNumberColumnEnabled": False, "layout": "full-width"},
              "content": [header_row] + data_rows
          }

          # Build optional CISA KEV panel
          kev_panel_blocks = []
          if kev_findings:
              kev_lines = []
              for k in kev_findings:
                  line_text = f"\U0001f525 {k['id']} — Due: {k['due_date']}"
                  if k["ransomware"]:
                      line_text += " ⚠️ Ransomware"
                  if k["required_action"]:
                      line_text += f"\n   Action: {k['required_action']}"
                  kev_lines.append({"type": "paragraph", "content": [
                      {"type": "text", "text": line_text}
                  ]})
              kev_panel_blocks = [{
                  "type": "panel",
                  "attrs": {"panelType": "error"},
                  "content": [
                      {"type": "paragraph", "content": [
                          {"type": "text",
                           "text": f"\U0001f525 {len(kev_findings)} CISA Known Exploited Vulnerabilities Detected",
                           "marks": [{"type": "strong"}]}
                      ]},
                      *kev_lines,
                      {"type": "paragraph", "content": [
                          {"type": "text", "text": "CISA KEV Catalog",
                           "marks": [{"type": "link", "attrs": {
                               "href": "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
                           }}]}
                      ]}
                  ]
              }]

          adf = {
              "version": 1,
              "type": "doc",
              "content": [
                  *kev_panel_blocks,
                  {"type": "paragraph", "content": [
                      {"type": "text", "text": summary_line}
                  ]},
                  table,
                  {"type": "paragraph", "content": [
                      {"type": "text", "text": "Repository: "}, {"type": "text", "text": repo_name,
                           "marks": [{"type": "code"}]}
                  ]},
                  {"type": "paragraph", "content": [
                      {"type": "text", "text": "Workflow run: "},
                      {"type": "text", "text": run_url,
                       "marks": [{"type": "link", "attrs": {"href": run_url}}]}
                  ]},
                  {"type": "paragraph", "content": [
                      {"type": "text", "text": "\U0001F916 Automated ticket created by Epyon Security Scanner"}
                  ]}
              ]
          }

          print(json.dumps(adf))
          PYEOF
          }

          # ── Helper: add a Jira Remote Link pointing back to the GitHub issue ──
          link_jira_to_github() {
            local jira_key="$1"
            [[ -z "${GITHUB_ISSUE_URL:-}" ]] && return 0
            local link_payload
            link_payload=$(jq -n \
              --arg global_id  "github-issue-${GITHUB_ISSUE_NUMBER:-0}" \
              --arg gh_url     "${GITHUB_ISSUE_URL}" \
              --arg gh_title   "GitHub Issue #${GITHUB_ISSUE_NUMBER:-}" \
              '{
                globalId: $global_id,
                relationship: "GitHub Issue",
                object: {
                  url:   $gh_url,
                  title: $gh_title,
                  icon: {url16x16: "https://github.com/favicon.ico", title: "GitHub"}
                }
              }')
            local link_http
            link_http=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Basic ${AUTH}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data "${link_payload}" \
              "${JIRA_URL}/rest/api/3/issue/${jira_key}/remotelink")
            if [[ "${link_http}" == "201" ]]; then
              echo "✅ Linked ${jira_key} → GitHub issue #${GITHUB_ISSUE_NUMBER}"
            else
              echo "⚠️  Remote link on ${jira_key} returned HTTP ${link_http} — continuing"
            fi
          }

          # ── Helper: create one JIRA ticket ──
          create_jira_ticket() {
            local title="$1"
            local label_severity="$2"   # epyon-critical or epyon-high
            local priority="$3"         # Highest or High
            local severity_key="$4"     # critical_findings or high_findings
            local summary_line="$5"

            echo "--- Checking for existing open ticket: ${label_severity} / ${REPO_SLUG} ---"
            local http_code
            http_code=$(jira_search_open "${label_severity}")

            if [[ "${http_code}" == "200" ]]; then
              local total
              total=$(jq '.total // 0' /tmp/jira_search.json)
              if [[ "${total}" -gt 0 ]]; then
                local existing_url
                existing_url=$(jq -r '.issues[0].self' /tmp/jira_search.json)
                local existing_key
                existing_key=$(jq -r '.issues[0].key' /tmp/jira_search.json)

                # Only comment if the finding count embedded in summary_line has changed.
                # summary_line format: "Epyon found N <severity> severity finding(s) in REPO on DATE."
                # Extract the count from summary_line and compare against the last bot comment.
                local new_count
                new_count=$(echo "${summary_line}" | grep -oP 'found \K\d+' || echo "")

                local last_count=""
                local comments_http
                curl -s -o /tmp/jira_comments.json -w "%{http_code}" \
                  -H "Authorization: Basic ${AUTH}" \
                  -H "Accept: application/json" \
                  "${JIRA_URL}/rest/api/3/issue/${existing_key}/comment?maxResults=50&orderBy=-created" \
                  > /tmp/jira_comments_http.txt 2>/dev/null || true
                comments_http=$(cat /tmp/jira_comments_http.txt 2>/dev/null || echo "")
                if [[ "${comments_http}" == "200" ]] && [[ -f /tmp/jira_comments.json ]]; then
                  last_count=$(jq -r '
                    [ .comments[]? |
                      select(.body.content[]?.content[]?.text? | strings | test("Epyon found")) ] |
                    first |
                    .body.content[]?.content[]?.text? |
                    strings |
                    capture("found (?P<n>[0-9]+)") |
                    .n' /tmp/jira_comments.json 2>/dev/null || echo "")
                fi

                if [[ -n "${new_count}" && -n "${last_count}" && "${new_count}" == "${last_count}" ]]; then
                  echo "⏭️  JIRA ticket ${existing_key}: count unchanged (${new_count}) — skipping comment"
                  echo "${existing_key}|${JIRA_URL}/browse/${existing_key}" >> /tmp/jira_created_tickets.txt
                  return 0
                fi

                echo "🔄  Open ticket already exists for ${label_severity} (${REPO_SLUG}): ${existing_key} — adding update comment"
                echo "## 🔄 JIRA: Updated findings comment added" >> "${GITHUB_STEP_SUMMARY}"
                echo "- Severity group: **${label_severity}**" >> "${GITHUB_STEP_SUMMARY}"
                echo "- Ticket: [${existing_key}](${JIRA_URL}/browse/${existing_key})" >> "${GITHUB_STEP_SUMMARY}"
                local comment_payload
                comment_payload=$(jq -n --arg body "Updated Epyon scan findings on $(date -u +%Y-%m-%d): ${summary_line}\n\nRun: ${RUN_URL}" \
                  '{body: {version: 1, type: "doc", content: [{type: "paragraph", content: [{type: "text", text: $body}]}]}}')
                curl -s -o /dev/null \
                  -X POST \
                  -H "Authorization: Basic ${AUTH}" \
                  -H "Content-Type: application/json" \
                  -H "Accept: application/json" \
                  --data "${comment_payload}" \
                  "${JIRA_URL}/rest/api/3/issue/${existing_key}/comment"
                # Record so it appears in the Link step
                echo "${existing_key}|${JIRA_URL}/browse/${existing_key}" >> /tmp/jira_created_tickets.txt
                return 0
              fi
            else
              echo "⚠️  JIRA search returned HTTP ${http_code} — proceeding to create ticket anyway"
            fi

            echo "--- Building ADF body for ${label_severity} ---"
            local adf_body
            adf_body=$(build_adf_body "${severity_key}" "${summary_line}")

            jq -n \
              --arg project  "${PROJECT_KEY}" \
              --arg title    "${title}" \
              --arg itype    "${ISSUE_TYPE}" \
              --arg priority "${priority}" \
              --arg lsev     "${label_severity}" \
              --arg lrepo    "${REPO_SLUG}" \
              --argjson desc "${adf_body}" \
              '{
                fields: {
                  project:     { key: $project },
                  summary:     $title,
                  issuetype:   { name: $itype },
                  priority:    { name: $priority },
                  description: $desc,
                  labels:      ["epyon", "security", $lsev, $lrepo]
                }
              }' > /tmp/jira_payload.json

            echo "--- Creating JIRA ticket ---"
            local create_http
            create_http=$(curl -s -o /tmp/jira_create.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Basic ${AUTH}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data @/tmp/jira_payload.json \
              "${JIRA_URL}/rest/api/3/issue")

            if [[ "${create_http}" == "201" ]]; then
              local new_key
              new_key=$(jq -r '.key' /tmp/jira_create.json)
              echo "✅ Created JIRA ticket: ${new_key} (${JIRA_URL}/browse/${new_key})"
              echo "## ✅ JIRA Ticket Created" >> "${GITHUB_STEP_SUMMARY}"
              echo "- Severity group: **${label_severity}**" >> "${GITHUB_STEP_SUMMARY}"
              echo "- Ticket: [${new_key}](${JIRA_URL}/browse/${new_key})" >> "${GITHUB_STEP_SUMMARY}"

              # Record ticket for back-linking to GitHub issue
              echo "${new_key}|${JIRA_URL}/browse/${new_key}" >> /tmp/jira_created_tickets.txt
              link_jira_to_github "${new_key}"

              # ── Assign to active sprint (best-effort; failure does not abort) ──
              echo "--- Looking up active sprint for project '${PROJECT_KEY}' ---"
              local boards_http
              boards_http=$(curl -s -o /tmp/jira_boards.json -w "%{http_code}" \
                -H "Authorization: Basic ${AUTH}" \
                -H "Accept: application/json" \
                "${JIRA_URL}/rest/agile/1.0/board?projectKeyOrId=${PROJECT_KEY}&type=scrum&maxResults=1")
              if [[ "${boards_http}" == "200" ]]; then
                local board_id
                board_id=$(jq -r '.values[0].id // empty' /tmp/jira_boards.json)
                if [[ -n "${board_id}" ]]; then
                  local sprints_http
                  sprints_http=$(curl -s -o /tmp/jira_sprints.json -w "%{http_code}" \
                    -H "Authorization: Basic ${AUTH}" \
                    -H "Accept: application/json" \
                    "${JIRA_URL}/rest/agile/1.0/board/${board_id}/sprint?state=active&maxResults=1")
                  if [[ "${sprints_http}" == "200" ]]; then
                    local sprint_id
                    sprint_id=$(jq -r '.values[0].id // empty' /tmp/jira_sprints.json)
                    if [[ -n "${sprint_id}" ]]; then
                      local sprint_name
                      sprint_name=$(jq -r '.values[0].name // "active sprint"' /tmp/jira_sprints.json)
                      local move_http
                      move_http=$(curl -s -o /dev/null -w "%{http_code}" \
                        -X POST \
                        -H "Authorization: Basic ${AUTH}" \
                        -H "Content-Type: application/json" \
                        --data "{\"issues\":[\"${new_key}\"]}" \
                        "${JIRA_URL}/rest/agile/1.0/sprint/${sprint_id}/issue")
                      if [[ "${move_http}" == "204" ]]; then
                        echo "✅ Assigned ${new_key} to sprint: ${sprint_name}"
                        echo "- Sprint: **${sprint_name}**" >> "${GITHUB_STEP_SUMMARY}"
                      else
                        echo "⚠️  Could not assign to sprint (HTTP ${move_http}) — ticket created in backlog"
                      fi
                    else
                      echo "⚠️  No active sprint found for board ${board_id} — ticket created in backlog"
                    fi
                  else
                    echo "⚠️  Sprint lookup returned HTTP ${sprints_http} — ticket created in backlog"
                  fi
                else
                  echo "⚠️  No scrum board found for project '${PROJECT_KEY}' — ticket created in backlog"
                fi
              else
                echo "⚠️  Board lookup returned HTTP ${boards_http} — ticket created in backlog"
              fi
            else
              echo "❌ Failed to create JIRA ticket (HTTP ${create_http})"
              echo "Response: $(cat /tmp/jira_create.json)"
              echo "## ❌ JIRA Ticket Creation Failed" >> "${GITHUB_STEP_SUMMARY}"
              echo "- Severity group: **${label_severity}**" >> "${GITHUB_STEP_SUMMARY}"
              echo "- HTTP status: ${create_http}" >> "${GITHUB_STEP_SUMMARY}"
            fi
          }

          CRITICAL_COUNT="${{ steps.check-severity.outputs.critical }}"
          HIGH_COUNT="${{ steps.check-severity.outputs.high }}"
          MEDIUM_COUNT="${{ steps.check-severity.outputs.medium }}"
          LOW_COUNT="${{ steps.check-severity.outputs.low }}"

          # Create critical ticket
          if [[ "${CRITICAL_COUNT:-0}" -gt 0 ]]; then
            create_jira_ticket \
              "🔴 [Epyon] Critical Security Findings — ${REPO_NAME##*/} ${TODAY}" \
              "epyon-critical" \
              "Highest" \
              "critical_findings" \
              "Epyon found ${CRITICAL_COUNT} critical severity finding(s) in ${REPO_NAME} on ${TODAY}."
          fi

          # Create high ticket
          if [[ "${HIGH_COUNT:-0}" -gt 0 ]]; then
            create_jira_ticket \
              "🟠 [Epyon] High Security Findings — ${REPO_NAME##*/} ${TODAY}" \
              "epyon-high" \
              "High" \
              "high_findings" \
              "Epyon found ${HIGH_COUNT} high severity finding(s) in ${REPO_NAME} on ${TODAY}."
          fi

          # Create medium ticket
          if [[ "${MEDIUM_COUNT:-0}" -gt 0 ]]; then
            create_jira_ticket \
              "🟡 [Epyon] Medium Security Findings — ${REPO_NAME##*/} ${TODAY}" \
              "epyon-medium" \
              "Medium" \
              "medium_findings" \
              "Epyon found ${MEDIUM_COUNT} medium severity finding(s) in ${REPO_NAME} on ${TODAY}."
          fi

          # Create low ticket
          if [[ "${LOW_COUNT:-0}" -gt 0 ]]; then
            create_jira_ticket \
              "🔵 [Epyon] Low Security Findings — ${REPO_NAME##*/} ${TODAY}" \
              "epyon-low" \
              "Low" \
              "low_findings" \
              "Epyon found ${LOW_COUNT} low severity finding(s) in ${REPO_NAME} on ${TODAY}."
          fi

      - name: Link Jira Tickets to GitHub Issue
        if: >
          always() &&
          env.CREATE_JIRA_TICKETS == 'true' &&
          steps.create-github-issue.outputs.issue_number != '' &&
          env.JIRA_BASE_URL != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueNumber = parseInt('${{ steps.create-github-issue.outputs.issue_number }}');
            if (!issueNumber) { console.log('No GitHub issue number — skipping Jira link comment'); return; }

            const ticketsFile = '/tmp/jira_created_tickets.txt';
            if (!fs.existsSync(ticketsFile)) {
              console.log('No Jira tickets were created this run — skipping link comment');
              return;
            }

            const lines = fs.readFileSync(ticketsFile, 'utf8').trim().split('\n').filter(Boolean);
            if (!lines.length) { console.log('Jira tickets file is empty — skipping'); return; }

            const jiraBaseUrl = '${{ env.JIRA_BASE_URL }}';
            const ticketLinks = lines.map(line => {
              const [key, url] = line.split('|');
              return `- [${key}](${url})`;
            }).join('\n');

            const comment = [
              '### 🎫 Jira Tickets Created',
              '',
              'The following Jira tickets were opened for these security findings:',
              '',
              ticketLinks,
              '',
              '_Each Jira ticket also carries a remote link back to this issue._',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment,
            });
            console.log(`Posted ${lines.length} Jira ticket link(s) to GitHub issue #${issueNumber}`);

            // Update the GitHub issue title to include the JIRA key(s)
            const keys = lines.map(line => line.split('|')[0]).filter(Boolean);
            if (keys.length > 0) {
              const currentIssue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              const currentTitle = currentIssue.data.title;
              const jiraPrefix = keys.join(', ');
              // Only prepend if not already present
              if (!currentTitle.startsWith(jiraPrefix)) {
                const newTitle = `${jiraPrefix}: ${currentTitle}`;
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  title: newTitle,
                });
                console.log(`Updated issue #${issueNumber} title to: ${newTitle}`);
              }
            }

      - name: Fail on Critical Vulnerabilities
        if: always() && steps.check-severity.outputs.critical > 0
        run: |
          echo "::error::Found ${{ steps.check-severity.outputs.critical }} critical vulnerabilities"
          exit 1
