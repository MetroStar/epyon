name: Scan Public Repository

# Top-level permissions: restrict default to read-only
permissions:
  contents: read

# checkov:skip=CKV_GHA_7:Workflow inputs are required for user-specified repository scanning and do not affect SLSA build provenance
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Git repository URL to scan'
        required: true
        type: string
      pr_number:
        description: 'Optional: Pull request number to scan (GitHub repos). If set, takes precedence over target_ref'
        required: false
        type: string
      target_ref:
        description: 'Optional: Branch/tag/commit to scan (e.g., feature/my-branch, refs/heads/main, a1b2c3d)'
        required: false
        type: string
      subdirectory:
        description: 'Optional: Subdirectory path within repository to scan (e.g., apps/api)'
        required: false
        type: string
      scan_mode:
        description: 'Scan mode'
        required: false
        default: 'full'
        type: choice
        options:
          - quick
          - full
          - baseline
      fail_on_critical:
        description: 'Fail build on critical severity findings'
        required: false
        default: true
        type: boolean
      fail_on_high:
        description: 'Fail build on high severity findings'
        required: false
        default: true
        type: boolean
      warning_only:
        description: 'Report vulnerabilities but never fail the build'
        required: false
        default: false
        type: boolean
      garak_target_type:
        description: 'Garak generator type (for example: test, openai, huggingface)'
        required: false
        default: 'openai'
        type: choice
        options:
          - openai
          - test
          - huggingface
          - ollama
          - litellm
      garak_target_name:
        description: 'Garak target model name preset'
        required: false
        default: 'gpt-4o-mini'
        type: choice
        options:
          - gpt-4o-mini
          - gpt-4.1-mini
          - gpt-4o
          - gpt-4.1
          - llama3.1:8b
          - test.Blank
          - test.Repeat
      garak_target_name_custom:
        description: 'Optional custom Garak target model name (overrides preset when set)'
        required: false
        type: string
      garak_probes:
        description: 'Garak probe set'
        required: false
        default: 'promptinject'
        type: choice
        options:
          - promptinject
          - dan
          - encoding
          - malwaregen
          - knownbadsignatures
          - xss
          - lmrc
          - all

env:
  SCAN_MODE: ${{ github.event.inputs.scan_mode || 'full' }}
  FAIL_ON_CRITICAL: ${{ github.event.inputs.fail_on_critical }}
  FAIL_ON_HIGH: ${{ github.event.inputs.fail_on_high }}
  WARNING_ONLY: ${{ github.event.inputs.warning_only || 'false' }}
  GARAK_TARGET_TYPE: ${{ github.event.inputs.garak_target_type || 'openai' }}
  GARAK_TARGET_NAME: ${{ github.event.inputs.garak_target_name || 'gpt-4o-mini' }}
  GARAK_PROBES: ${{ github.event.inputs.garak_probes || 'promptinject' }}
  # Notification recipient: The user who triggered the scan will be notified
  NOTIFY_USERS: "${{ github.actor }}"

jobs:
  external-scan:
    name: Scan External Repository
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      actions: read
      issues: write
    
    steps:
      - name: Checkout Epyon
        uses: actions/checkout@v4
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Docker Images
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-
      
      - name: Pull Security Tool Images
        run: |
          docker pull anchore/grype:latest &
          docker pull aquasec/trivy:latest &
          docker pull trufflesecurity/trufflehog:latest &
          docker pull anchore/syft:latest &
          wait
          echo "All security tool images cached"
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-pip bats
          pip3 install pyyaml

      - name: Install kcov for shell coverage
        continue-on-error: true
        run: |
          sudo apt-get install -y kcov 2>/dev/null \
            && echo "kcov installed via apt" \
            || echo "kcov not in apt — will build from source during coverage generation"
      
      - name: Initialize Scan
        id: init-scan
        env:
          TARGET_NAME: ${{ github.event.inputs.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GARAK_TARGET_NAME_CUSTOM_INPUT: ${{ github.event.inputs.garak_target_name_custom }}
        run: |
          chmod +x scripts/shell/run-target-security-scan.sh

          EPYON_VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo "unknown")
          echo "Using Epyon version: $EPYON_VERSION"
          
          # Extract repo name from URL
          REPO_URL="${{ github.event.inputs.repository }}"
          REPO_NAME=$(basename "$REPO_URL" .git)
          SUBDIR="${{ github.event.inputs.subdirectory }}"
          PR_NUMBER="${{ github.event.inputs.pr_number }}"
          TARGET_REF="${{ github.event.inputs.target_ref }}"
          GIT_CHECKOUT_TARGET=""

          if [[ -n "$PR_NUMBER" ]]; then
            GIT_CHECKOUT_TARGET="refs/pull/${PR_NUMBER}/merge"
            echo "🎯 Targeting PR #$PR_NUMBER ($GIT_CHECKOUT_TARGET)"
          elif [[ -n "$TARGET_REF" ]]; then
            GIT_CHECKOUT_TARGET="$TARGET_REF"
            echo "🎯 Targeting ref: $TARGET_REF"
          fi
          
          # Set target name based on subdirectory if provided
          if [[ -n "$SUBDIR" ]]; then
            TARGET_NAME=$(basename "$SUBDIR")
          else
            TARGET_NAME="$REPO_NAME"
          fi

          GARAK_TARGET_NAME_RESOLVED="${GARAK_TARGET_NAME:-gpt-4o-mini}"
          if [[ -n "${GARAK_TARGET_NAME_CUSTOM_INPUT:-}" ]]; then
            GARAK_TARGET_NAME_RESOLVED="$GARAK_TARGET_NAME_CUSTOM_INPUT"
          fi
          
          echo "TARGET_NAME=$TARGET_NAME" > /tmp/epyon-env
          echo "SCAN_MODE=${{ github.event.inputs.scan_mode }}" >> /tmp/epyon-env
          echo "GITHUB_ACTOR=$GITHUB_ACTOR" >> /tmp/epyon-env
          echo "EPYON_VERSION=$EPYON_VERSION" >> /tmp/epyon-env
          echo "REPO_URL=$REPO_URL" >> /tmp/epyon-env
          echo "SUBDIR=$SUBDIR" >> /tmp/epyon-env
          echo "GARAK_TARGET_TYPE=${GARAK_TARGET_TYPE:-openai}" >> /tmp/epyon-env
          echo "GARAK_TARGET_NAME=$GARAK_TARGET_NAME_RESOLVED" >> /tmp/epyon-env
          echo "GARAK_PROBES=${GARAK_PROBES:-promptinject}" >> /tmp/epyon-env
          echo "PR_NUMBER=$PR_NUMBER" >> /tmp/epyon-env
          echo "TARGET_REF=$TARGET_REF" >> /tmp/epyon-env
          echo "GIT_CHECKOUT_TARGET=$GIT_CHECKOUT_TARGET" >> /tmp/epyon-env
          
          # Clone the repository (with sparse-checkout if subdirectory specified)
          if [[ -n "$SUBDIR" ]]; then
            echo "📥 Cloning repository with sparse-checkout (subdirectory: $SUBDIR)"
            git clone --filter=blob:none --sparse "$REPO_URL" "target-repo-$REPO_NAME" || exit 1
            cd "target-repo-$REPO_NAME"

            if [[ -n "$GIT_CHECKOUT_TARGET" ]]; then
              echo "🔀 Fetching and checking out target: $GIT_CHECKOUT_TARGET"
              git fetch origin "$GIT_CHECKOUT_TARGET" || {
                echo "❌ Unable to fetch target '$GIT_CHECKOUT_TARGET' from $REPO_URL"
                exit 1
              }
              git checkout --detach FETCH_HEAD || {
                echo "❌ Unable to checkout fetched target '$GIT_CHECKOUT_TARGET'"
                exit 1
              }
            fi

            git sparse-checkout set "$SUBDIR" || exit 1
            cd ..
            echo "TARGET_DIR=$PWD/target-repo-$REPO_NAME/$SUBDIR" >> /tmp/epyon-env
            echo "✅ Sparse-checkout completed: $SUBDIR"
          else
            echo "📥 Cloning full repository: $REPO_URL"
            git clone "$REPO_URL" "target-repo-$REPO_NAME" || exit 1

            if [[ -n "$GIT_CHECKOUT_TARGET" ]]; then
              cd "target-repo-$REPO_NAME"
              echo "🔀 Fetching and checking out target: $GIT_CHECKOUT_TARGET"
              git fetch origin "$GIT_CHECKOUT_TARGET" || {
                echo "❌ Unable to fetch target '$GIT_CHECKOUT_TARGET' from $REPO_URL"
                exit 1
              }
              git checkout --detach FETCH_HEAD || {
                echo "❌ Unable to checkout fetched target '$GIT_CHECKOUT_TARGET'"
                exit 1
              }
              cd ..
            fi

            echo "TARGET_DIR=$PWD/target-repo-$REPO_NAME" >> /tmp/epyon-env
          fi
          
          # Create scan directory
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          USERNAME="${GITHUB_ACTOR}"
          SCAN_NAME="${REPO_NAME}_${USERNAME}_${TIMESTAMP}"
          SCAN_DIR="scans/${SCAN_NAME}"
          mkdir -p "$SCAN_DIR"
          echo "SCAN_DIR=$PWD/$SCAN_DIR" >> /tmp/epyon-env
          echo "SCAN_NAME=$SCAN_NAME" >> /tmp/epyon-env
          echo "scan_dir=$SCAN_DIR" >> $GITHUB_OUTPUT
          echo "scan_id=$SCAN_NAME" >> $GITHUB_OUTPUT
          echo "🚀 Initialized scan: $SCAN_NAME"
      
      - name: Layer 1 - Generate SBOM
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          echo "📋 Layer 1: Software Bill of Materials (SBOM)"
          chmod +x scripts/shell/run-complete-sbom-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-complete-sbom-scan.sh || echo "SBOM scan completed with warnings"
      
      - name: Layer 2 - Secret Detection (TruffleHog)
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          echo "🔐 Layer 2: Secret Detection"
          chmod +x scripts/shell/run-trufflehog-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-trufflehog-scan.sh filesystem || echo "TruffleHog scan completed with warnings"
      
      - name: Layer 3 - Code Quality (SonarQube)
        if: env.SCAN_MODE != 'quick'
        continue-on-error: true
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          # Optional PR context for manual PR-targeted scans
          SONAR_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          source /tmp/epyon-env
          echo "📊 Layer 3: Code Quality Analysis"

          # Derive a stable Sonar project key per repo (and optional subdirectory).
          # Fallback to owner_repo when SONAR_PROJECT_KEY is not set.
          RAW_BASE_KEY="${SONAR_PROJECT_KEY:-${GITHUB_REPOSITORY/\//\_}}"
          if [[ -n "${SUBDIR:-}" ]]; then
            SANITIZED_SUBDIR=$(echo "$SUBDIR" | sed -E 's#[/[:space:]]+#_#g; s#[^A-Za-z0-9._:-]#_#g')
            RAW_BASE_KEY="${RAW_BASE_KEY}_${SANITIZED_SUBDIR}"
          fi
          DERIVED_PROJECT_KEY=$(echo "$RAW_BASE_KEY" | sed -E 's#[^A-Za-z0-9._:-]#_#g; s#_+#_#g; s#^[_:. -]+##; s#[_:. -]+$##')
          if [[ -z "$DERIVED_PROJECT_KEY" ]]; then
            DERIVED_PROJECT_KEY="${GITHUB_REPOSITORY/\//\_}"
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ -n "${SUBDIR:-}" ]]; then
            DERIVED_PROJECT_NAME="${REPO_NAME} (${SUBDIR})"
          else
            DERIVED_PROJECT_NAME="$REPO_NAME"
          fi

          export SONAR_PROJECT_KEY="$DERIVED_PROJECT_KEY"
          export SONAR_PROJECT_NAME="$DERIVED_PROJECT_NAME"

          # Provide branch/PR context for scanners/scripts that consume these env vars.
          if [[ -n "${SONAR_PR_NUMBER:-}" ]]; then
            export SONAR_PR_BRANCH="${GITHUB_HEAD_REF:-}"
            export SONAR_PR_BASE="${GITHUB_BASE_REF:-}"
          else
            export SONAR_BRANCH="${GITHUB_REF_NAME:-}"
          fi

          echo "Using SONAR_PROJECT_KEY=$SONAR_PROJECT_KEY"
          echo "Using SONAR_PROJECT_NAME=$SONAR_PROJECT_NAME"

          chmod +x scripts/shell/run-sonar-analysis.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-sonar-analysis.sh || echo "SonarQube analysis completed with warnings"
      
      - name: Layer 4 - Malware Detection (ClamAV)
        if: env.SCAN_MODE != 'quick'
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          echo "🦠 Layer 4: Malware Detection"
          chmod +x scripts/shell/run-clamav-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-clamav-scan.sh || echo "ClamAV scan completed with warnings"
      
      - name: Layer 5 - Helm Chart Build
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          echo "🏗️ Layer 5: Helm Chart Building"
          chmod +x scripts/shell/run-helm-build.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-helm-build.sh || echo "Helm build completed with warnings"
      
      - name: Layer 6 - Infrastructure Security (Checkov)
        if: env.SCAN_MODE != 'quick'
        continue-on-error: true
        env:
          CI: true
        run: |
          source /tmp/epyon-env
          echo "☸️ Layer 6: Infrastructure Security"
          echo "CI=$CI GITHUB_ACTIONS=$GITHUB_ACTIONS"
          chmod +x scripts/shell/run-checkov-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-checkov-scan.sh || echo "Checkov scan completed with warnings"
      
      - name: Layer 7 - Container Security (Trivy)
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          echo "🛡️ Layer 7: Container Security (Trivy)"
          chmod +x scripts/shell/run-trivy-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-trivy-scan.sh filesystem || echo "Trivy scan completed with warnings"
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-trivy-scan.sh base || echo "Trivy base image scan completed with warnings"
      
      - name: Layer 8 - Vulnerability Detection (Grype)
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          echo "🔍 Layer 8: Vulnerability Detection (Grype)"
          chmod +x scripts/shell/run-grype-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-grype-scan.sh sbom || echo "Grype SBOM scan completed with warnings"
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-grype-scan.sh images || echo "Grype image scan completed with warnings"
      
      - name: Layer 9 - End-of-Life Detection (Xeol)
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          echo "⚰️ Layer 9: End-of-Life Detection"
          chmod +x scripts/shell/run-xeol-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-xeol-scan.sh || echo "Xeol scan completed with warnings"
      
      - name: Layer 10 - Anchore Security
        if: env.SCAN_MODE != 'quick'
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          echo "⚓ Layer 10: Anchore Security Analysis"
          chmod +x scripts/shell/run-anchore-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-anchore-scan.sh || echo "Anchore scan completed with warnings"
      
      - name: Layer 11 - API Discovery
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          echo "🌐 Layer 11: API Discovery"
          chmod +x scripts/shell/run-api-discovery.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-api-discovery.sh || echo "API Discovery completed with warnings"

      - name: Layer 12 - LLM Security (Garak)
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          source /tmp/epyon-env
          echo "🤖 Layer 12: LLM Security (Garak)"
          chmod +x scripts/shell/run-garak-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" GARAK_TARGET_TYPE="${GARAK_TARGET_TYPE}" GARAK_TARGET_NAME="${GARAK_TARGET_NAME}" GARAK_PROBES="${GARAK_PROBES}" ./scripts/shell/run-garak-scan.sh || echo "Garak scan completed with warnings"

      - name: Generate Shell Coverage
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          echo "📐 Generating shell coverage for $TARGET_DIR"
          chmod +x scripts/shell/run-shell-coverage.sh
          REPO_PATH="$TARGET_DIR" ./scripts/shell/run-shell-coverage.sh || true
      
      - name: Generate Scan Manifest
        if: always()
        run: |
          source /tmp/epyon-env
          echo "🔐 Generating cryptographic scan manifest..."
          echo "DEBUG: SCAN_DIR = $SCAN_DIR"
          chmod +x scripts/shell/generate-scan-manifest.sh
          ./scripts/shell/generate-scan-manifest.sh "$SCAN_DIR" || echo "Manifest generation completed with warnings"
          echo "✅ Manifest generated: $SCAN_DIR/scan-manifest.json"
          echo "DEBUG: Checking if manifest exists..."
          ls -la "$SCAN_DIR"/scan-manifest* "$SCAN_DIR"/manifest-summary* 2>&1 || echo "Manifest files not found!"
      
      - name: Generate Security Findings Summary
        if: always()
        run: |
          source /tmp/epyon-env
          echo "📊 Generating deduplicated security findings summary..."
          chmod +x scripts/shell/generate-scan-findings-summary.sh
          source scripts/shell/generate-scan-findings-summary.sh
          generate_scan_findings_summary "$(basename $SCAN_DIR)" "$TARGET_DIR" "$PWD" || echo "Summary generation completed with warnings"
          echo "✅ Summary generated with deduplicated counts"
      
      - name: Check Severity Gate
        id: severity-gate
        continue-on-error: true
        run: |
          # Source environment variables from epyon-env
          if [ -f /tmp/epyon-env ]; then
            set -a
            source /tmp/epyon-env
            set +a
          fi
          export FAIL_ON_CRITICAL="${{ github.event.inputs.fail_on_critical }}"
          export FAIL_ON_HIGH="${{ github.event.inputs.fail_on_high }}"
          export WARNING_ONLY="${{ github.event.inputs.warning_only }}"
          chmod +x scripts/shell/check-severity-gate.sh
          ./scripts/shell/check-severity-gate.sh
      
      - name: Generate Reports & Dashboard
        if: always()
        run: |
          source /tmp/epyon-env
          echo "📊 Generating consolidated reports and dashboard..."
          echo "DEBUG: SCAN_DIR = $SCAN_DIR"
          echo "DEBUG: Before consolidation, manifest files:"
          ls -la "$SCAN_DIR"/scan-manifest* "$SCAN_DIR"/manifest-summary* 2>&1 || echo "Manifest files not found before consolidation!"
          chmod +x scripts/shell/consolidate-security-reports.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="$TARGET_DIR" ./scripts/shell/consolidate-security-reports.sh || echo "Report generation completed with warnings"
          echo "DEBUG: After consolidation, checking directory structure..."
          ls -la "$SCAN_DIR/consolidated-reports/" || echo "consolidated-reports not found"
          ls -la "$SCAN_DIR/consolidated-reports/markdown-reports/" 2>&1 || echo "markdown-reports directory not found!"
          echo "DEBUG: Searching for executive-summary.md anywhere in scan directory..."
          find "$SCAN_DIR" -name "executive-summary.md" -type f 2>&1 || echo "No executive-summary.md found"
          echo "DEBUG: After consolidation, manifest files in consolidated-reports:"
          ls -la "$SCAN_DIR/consolidated-reports"/scan-manifest* "$SCAN_DIR/consolidated-reports"/manifest-summary* 2>&1 || echo "Manifest files not found in consolidated-reports!"
      
      - name: Find Scan Directory
        id: find-scan
        if: always()
        run: |
          SCAN_DIR=$(cat /tmp/epyon-env | grep "SCAN_DIR=" | cut -d= -f2 | sed "s|$PWD/||")
          SCAN_ID=$(basename "$SCAN_DIR")
          echo "scan_dir=$SCAN_DIR" >> $GITHUB_OUTPUT
          echo "scan_id=$SCAN_ID" >> $GITHUB_OUTPUT
          echo "Found scan directory: $SCAN_DIR"
          echo "Scan ID: $SCAN_ID"
      
      - name: Debug Scan Directory
        if: always()
        run: |
          SCAN_DIR="${{ steps.find-scan.outputs.scan_dir }}"
          echo "Scan directory: $SCAN_DIR"
          echo "Contents:"
          ls -la "$SCAN_DIR" || echo "Directory not found"
          echo "Subdirectories:"
          find "$SCAN_DIR" -type f -name "*.json" | head -20 || echo "No files found"
      
      - name: Fix Artifact Permissions
        if: always()
        run: |
          SCAN_DIR="${{ steps.find-scan.outputs.scan_dir }}"
          if [ -d "$SCAN_DIR" ]; then
            echo "Fixing permissions for: $SCAN_DIR"
            # Change ownership to runner user first
            sudo chown -R runner:docker "$SCAN_DIR" || true
            # Then fix permissions
            sudo chmod -R a+r "$SCAN_DIR" || true
            sudo find "$SCAN_DIR" -type d -exec chmod a+rx {} \; || true
            # Verify permissions
            ls -la "$SCAN_DIR/clamav/" || true
          fi
      
      - name: Upload Complete Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.find-scan.outputs.scan_id }}
          path: ${{ steps.find-scan.outputs.scan_dir }}/
          retention-days: 90
      
      - name: Generate Summary
        if: always()
        run: |
          if [ -f /tmp/epyon-env ]; then
            source /tmp/epyon-env
          fi
          SCAN_DIR="${{ steps.find-scan.outputs.scan_dir }}"
          GARAK_RESULTS_FILE="$SCAN_DIR/garak/garak-results.json"

          echo "**Epyon Version:** \`${EPYON_VERSION:-unknown}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Build notification line
          NOTIFY_USERS="${{ env.NOTIFY_USERS }}"
          NOTIFY_LINE=""
          if [ -n "$NOTIFY_USERS" ]; then
            for user in ${NOTIFY_USERS//,/ }; do
              NOTIFY_LINE="$NOTIFY_LINE @$user"
            done
          fi
          
          echo "## 🛡️ Security Scan Results for External Repository" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ github.event.inputs.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Mode:** \`${{ env.SCAN_MODE }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.pr_number }}" ]; then
            echo "**Target PR:** \`#${{ github.event.inputs.pr_number }}\`" >> $GITHUB_STEP_SUMMARY
          elif [ -n "${{ github.event.inputs.target_ref }}" ]; then
            echo "**Target Ref:** \`${{ github.event.inputs.target_ref }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          [ -n "$NOTIFY_LINE" ] && echo "**Notifying:**$NOTIFY_LINE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🤖 Garak LLM Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f "$GARAK_RESULTS_FILE" ]; then
            GARAK_STATUS=$(jq -r '.status // "unknown"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "unknown")
            GARAK_TARGET_TYPE=$(jq -r '.target_type // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_TARGET_NAME=$(jq -r '.target_name // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_RUNTIME_TARGET=$(jq -r '.runtime_target // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_RUNTIME_CLASSIFICATION=$(jq -r '.runtime_classification // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_TARGET_ORIGIN=$(jq -r '.target_origin // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_PROBES=$(jq -r '.probes // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_EXIT_CODE=$(jq -r '.exit_code // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_HIT_LOG=$(jq -r '.hit_log // empty' "$GARAK_RESULTS_FILE" 2>/dev/null || true)
            GARAK_HIT_COUNT="0"
            if [ -n "$GARAK_HIT_LOG" ] && [ -f "$SCAN_DIR/garak/$GARAK_HIT_LOG" ]; then
              GARAK_HIT_COUNT=$(wc -l < "$SCAN_DIR/garak/$GARAK_HIT_LOG" | tr -d '[:space:]')
            fi
            echo "- Status: \`$GARAK_STATUS\`" >> $GITHUB_STEP_SUMMARY
            echo "- Target: \`$GARAK_TARGET_TYPE\` / \`$GARAK_TARGET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- Runtime target: \`$GARAK_RUNTIME_TARGET\`" >> $GITHUB_STEP_SUMMARY
            echo "- Runtime class: \`$GARAK_RUNTIME_CLASSIFICATION\`" >> $GITHUB_STEP_SUMMARY
            echo "- Target origin: \`$GARAK_TARGET_ORIGIN\`" >> $GITHUB_STEP_SUMMARY
            echo "- Probes: \`$GARAK_PROBES\`" >> $GITHUB_STEP_SUMMARY
            echo "- Probe hits: \`$GARAK_HIT_COUNT\`" >> $GITHUB_STEP_SUMMARY
            echo "- Exit code: \`$GARAK_EXIT_CODE\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Garak results were not generated in this run." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          SUMMARY_FILE="$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md"
          echo "DEBUG: Looking for summary at: $SUMMARY_FILE"
          echo "DEBUG: Current directory: $(pwd)"
          ls -la "$SCAN_DIR/consolidated-reports/markdown-reports/" 2>&1 || echo "Directory not found"
          
          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Executive summary file not found at expected location" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please download the artifacts to view the complete security dashboard." >> $GITHUB_STEP_SUMMARY
          fi      
      - name: Create Notification Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const notifyUsers = '${{ env.NOTIFY_USERS }}'.split(',').map(u => `@${u.trim()}`).join(' ');
            const repository = '${{ github.event.inputs.repository }}';
            const scanMode = '${{ env.SCAN_MODE }}';
            const prNumber = '${{ github.event.inputs.pr_number }}';
            const targetRef = '${{ github.event.inputs.target_ref }}';
            const triggeredBy = '@${{ github.actor }}';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const targetLine = prNumber
              ? `**Target PR:** \`#${prNumber}\``
              : (targetRef ? `**Target Ref:** \`${targetRef}\`` : '');
            
            const issueBody = `## 🛡️ External Repository Security Scan Complete
            
            **Repository Scanned:** \`${repository}\`
            **Scan Mode:** \`${scanMode}\`
            ${targetLine}
            **Triggered by:** ${triggeredBy}
            **Notifying:** ${notifyUsers}
            
            ### 📊 Scan Results
            
            View the complete scan results and dashboard in the [workflow run](${runUrl}).
            
            ### 📦 Next Steps
            
            1. Download the scan artifacts from the workflow run
            2. Open the interactive security dashboard
            3. Review findings by severity
            4. Address critical and high-severity vulnerabilities
            
            ---
            *This is an automated notification from Epyon Security Scanner*
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🛡️ Security Scan Complete: ${repository.split('/').pop()} - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: ['security-scan', 'epyon']
            });