name: Scan Public Repository
run-name: "Scan: ${{ inputs.repository }}"

permissions:
  contents: read

# checkov:skip=CKV_GHA_7:Workflow inputs are required for user-specified repository scanning and do not affect SLSA build provenance
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Git repository URL, HuggingFace repo (org/name), or GitHub tree URL to scan'
        required: true
        type: string
      pr_number:
        description: 'Pull request number (GitHub repos)'
        required: false
        type: string
      target_ref:
        description: 'Branch/tag/commit to scan'
        required: false
        type: string
      subdirectory:
        description: 'Subdirectory to scan (e.g., apps/api or tests/data/models)'
        required: false
        type: string
      scan_mode:
        description: 'Scan mode'
        required: false
        default: 'full'
        type: choice
        options:
          - quick
          - full
          - nightly
          - baseline
          - huggingface
          - local_model
      hf_type:
        description: 'HuggingFace repository type (only used when scan_mode is huggingface)'
        required: false
        default: 'model'
        type: choice
        options:
          - model
          - space
          - dataset
      run_picklescan:
        description: 'Force-enable Layer 14 — Pickle/Serialization Safety (auto-enabled when model files are found)'
        required: false
        default: false
        type: boolean
      run_modelcard:
        description: 'Force-enable Layer 15 — Model Card Compliance (auto-enabled when model files + README found)'
        required: false
        default: false
        type: boolean
      fail_on_critical:
        description: 'Fail on critical severity findings'
        required: false
        default: true
        type: boolean
      fail_on_high:
        description: 'Fail on high severity findings'
        required: false
        default: true
        type: boolean
      warning_only:
        description: 'Report vulnerabilities but never fail the build'
        required: false
        default: false
        type: boolean
      run_garak:
        description: 'Run Garak LLM security probing (Layer 12); requires secrets: inherit'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Resolve the target URL — handles plain HuggingFace slugs (org/name) and
  # GitHub tree URLs in addition to normal git clone URLs.
  resolve-target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      repository_url: ${{ steps.resolve.outputs.repository_url }}
      garak_target_type: ${{ steps.resolve.outputs.garak_target_type }}
      garak_target_name: ${{ steps.resolve.outputs.garak_target_name }}
    steps:
      - name: Resolve target URL
        id: resolve
        run: |
          INPUT="${{ inputs.repository }}"
          SCAN_MODE="${{ inputs.scan_mode }}"
          HF_TYPE="${{ inputs.hf_type }}"
          RUN_GARAK="${{ inputs.run_garak }}"

          # ── HuggingFace mode: accept slug (org/name) or full URL ──────────
          if [[ "$SCAN_MODE" == "huggingface" ]]; then
            # Strip any leading https://huggingface.co/ prefix
            SLUG="${INPUT#https://huggingface.co/}"
            SLUG="${SLUG#spaces/}"
            SLUG="${SLUG#datasets/}"

            case "$HF_TYPE" in
              space)   REPO_URL="https://huggingface.co/spaces/${SLUG}" ;;
              dataset) REPO_URL="https://huggingface.co/datasets/${SLUG}" ;;
              model|*) REPO_URL="https://huggingface.co/${SLUG}" ;;
            esac

            echo "repository_url=$REPO_URL" >> "$GITHUB_OUTPUT"

            if [[ "$RUN_GARAK" == "true" && "$HF_TYPE" == "model" ]]; then
              echo "garak_target_type=huggingface" >> "$GITHUB_OUTPUT"
              echo "garak_target_name=${SLUG}" >> "$GITHUB_OUTPUT"
            else
              echo "garak_target_type=openai" >> "$GITHUB_OUTPUT"
              echo "garak_target_name=gpt-4o-mini" >> "$GITHUB_OUTPUT"
            fi

          # ── GitHub browser tree URL: convert to clone URL ─────────────────
          elif echo "$INPUT" | grep -qE '^https://github\.com/[^/]+/[^/]+/tree/'; then
            REPO_URL="$(echo "$INPUT" | sed -E 's|/tree/[^/]+(.*)||').git"
            echo "repository_url=$REPO_URL" >> "$GITHUB_OUTPUT"
            echo "garak_target_type=openai" >> "$GITHUB_OUTPUT"
            echo "garak_target_name=gpt-4o-mini" >> "$GITHUB_OUTPUT"

          # ── Plain git URL (https/ssh) or local path ───────────────────────
          else
            echo "repository_url=$INPUT" >> "$GITHUB_OUTPUT"
            echo "garak_target_type=openai" >> "$GITHUB_OUTPUT"
            echo "garak_target_name=gpt-4o-mini" >> "$GITHUB_OUTPUT"
          fi

  external-scan:
    needs: resolve-target
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
      security-events: write
    uses: ./.github/workflows/epyon-scan.yml
    with:
      repository_url: ${{ needs.resolve-target.outputs.repository_url }}
      pr_number: ${{ inputs.pr_number || '' }}
      target_ref: ${{ inputs.target_ref || '' }}
      subdirectory: ${{ inputs.subdirectory || '' }}
      scan_mode: ${{ inputs.scan_mode || 'full' }}
      hf_type: ${{ inputs.hf_type || 'model' }}
      run_picklescan: ${{ inputs.run_picklescan == true }}
      run_modelcard: ${{ inputs.run_modelcard == true }}
      fail_on_critical: ${{ inputs.fail_on_critical != false }}
      fail_on_high: ${{ inputs.fail_on_high != false }}
      warning_only: ${{ inputs.warning_only == true }}
      run_garak: ${{ inputs.run_garak == true && 'true' || 'false' }}
      garak_target_type: ${{ needs.resolve-target.outputs.garak_target_type }}
      garak_target_name: ${{ needs.resolve-target.outputs.garak_target_name }}
      create_github_issue: false
      create_jira_tickets: false
      write_metrics: false
    secrets: inherit
