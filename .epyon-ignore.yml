# Epyon Security Findings Ignore File
# Suppressions for security findings within Epyon itself

version: "1.0"

ignores:
  # GitHub Actions workflow permissions - Required for repository scanning
  # CKV2_GHA_1: Ensure top-level permissions are not set to write-all
  - type: path
    value: "/.github/workflows/scan-public-repo.yml"
    reason: "Job-level permissions properly scoped; workflow requires no top-level permissions for external repository scanning"
    approved_by: "epyon-maintainers@metrostar.com"
    
  - type: path
    value: "/.github/workflows/baseline-scan.yml"
    reason: "Job-level permissions properly scoped; workflow requires no top-level permissions for baseline scanning"
    approved_by: "epyon-maintainers@metrostar.com"
    
  - type: path
    value: "/.github/workflows/scan-private-repo.yml"
    reason: "Job-level permissions properly scoped; workflow requires no top-level permissions for private repository scanning"
    approved_by: "epyon-maintainers@metrostar.com"

# Notes:
# - CKV2_GHA_1 checks for top-level write-all permissions in GitHub Actions workflows
# - All workflows use job-level permissions that are properly scoped (contents: read, actions: read)
# - No top-level permissions directive is needed as jobs define their own minimal permissions
# - CKV_GHA_7 skip annotations are also added to workflow files themselves for inline documentation
