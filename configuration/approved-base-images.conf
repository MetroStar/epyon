# Approved Base Images Configuration
# ====================================
# This file defines the approved hardened container images for all security scans
# and deployments. Using Docker Hardened Images (DHI) for enhanced security.
#
# 🔒 SECURITY BEST PRACTICES:
# ---------------------------
# 1. ALWAYS pull latest images before scanning:
#    docker pull dhi/caddy:latest
#
# 2. Check for updates regularly - DHI releases security patches frequently
#
# 3. Review scan results in: scans/<project>_<user>_<timestamp>/
#    - trivy/     - Container & filesystem vulnerabilities
#    - grype/     - Package vulnerabilities
#    - security-findings-summary.json - Consolidated high/critical findings
#
# 4. For production deployments, pin to specific patch versions after testing:
#    dhi/caddy:2.7.5 (instead of :latest)
#
# 5. Monitor CVE databases:
#    - https://hub.docker.com/hardened-images/catalog
#    - https://nvd.nist.gov/
#
# Benefits of Docker Hardened Images (DHI):
# - Non-root by default
# - Regular security updates
# - Minimal attack surface
# - CIS benchmark compliance
# - Reduced CVE exposure
# - Distroless base (no package manager)
# - Consistent tagging and versioning
#
# Usage: Source this file in scanner scripts
#   source "$SCRIPT_DIR/../configuration/approved-base-images.conf"
#
# Last Updated: 2026-02-04
#
# ============================================
# BUNDLED DEPENDENCIES & VULNERABILITY SOURCES
# ============================================
# DHI images are minimal and hardened. Vulnerabilities may come from:
#
# dhi/caddy:
#   - Caddy web server (Go-based)
#   - Minimal runtime dependencies
#   - No package manager (distroless)
#
# dhi/node:
#   - Node.js runtime
#   - Minimal system packages
#   - No package manager (distroless)
#
# dhi/nginx:
#   - NGINX web server
#   - Minimal dependencies
#   - No package manager (distroless)
#
# SCAN COVERAGE:
#   - Container image scans (Trivy/Grype): Scan ALL packages in the image
#   - Filesystem scans: Skip node_modules (local dev deps not shipped)
#   - SBOM scans: Generate full software bill of materials
#
# KNOWN BENEFITS (as of 2026-02-04):
#   dhi/caddy:latest - Modern, secure web server
#   NOTE: DHI images are continuously updated with security patches
#   
#   Security advantages:
#   - Significantly fewer CVEs than standard images
#   - No unnecessary binaries or package managers
#   - Reduced attack surface
#   - FIPS compliance available
#   
#   ACTION REQUIRED: Run 'docker pull dhi/caddy:latest' regularly to get
#   the most recent security updates.

