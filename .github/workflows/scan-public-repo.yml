name: Scan Public Repository
run-name: "Scan: ${{ inputs.repository }}"

permissions:
  contents: read

# checkov:skip=CKV_GHA_7:Workflow inputs are required for user-specified repository scanning and do not affect SLSA build provenance
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Git repository URL to scan'
        required: true
        type: string
      pr_number:
        description: 'Pull request number (GitHub repos)'
        required: false
        type: string
      target_ref:
        description: 'Branch/tag/commit to scan'
        required: false
        type: string
      subdirectory:
        description: 'Subdirectory to scan (e.g., apps/api)'
        required: false
        type: string
      scan_mode:
        description: 'Scan mode'
        required: false
        default: 'full'
        type: choice
        options:
          - quick
          - full
          - nightly
          - baseline
          - huggingface
      fail_on_critical:
        description: 'Fail on critical severity findings'
        required: false
        default: true
        type: boolean
      fail_on_high:
        description: 'Fail on high severity findings'
        required: false
        default: true
        type: boolean
      warning_only:
        description: 'Report vulnerabilities but never fail the build'
        required: false
        default: false
        type: boolean
      run_garak:
        description: 'Run Garak LLM security probing (Layer 12); requires secrets: inherit'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  external-scan:
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
      security-events: write
    uses: ./.github/workflows/epyon-scan.yml
    with:
      repository_url: ${{ inputs.repository }}
      pr_number: ${{ inputs.pr_number || '' }}
      target_ref: ${{ inputs.target_ref || '' }}
      subdirectory: ${{ inputs.subdirectory || '' }}
      scan_mode: ${{ inputs.scan_mode || 'full' }}
      fail_on_critical: ${{ inputs.fail_on_critical != false }}
      fail_on_high: ${{ inputs.fail_on_high != false }}
      warning_only: ${{ inputs.warning_only == true }}
      run_garak: ${{ inputs.run_garak == true && 'true' || 'false' }}
      create_github_issue: false
      create_jira_tickets: false
      write_metrics: false
    secrets: inherit
