name: Private Security Scan

# Epyon private-repo scanner entrypoint.
# This workflow delegates execution to the local reusable workflow.

permissions:
  contents: read

on:
  schedule:
    # Nightly run at 2 AM UTC
    - cron: '0 2 * * *'
  # checkov:skip=CKV_GHA_7:Workflow inputs control scan parameters not build artifacts
  workflow_dispatch:
    inputs:
      subdirectory:
        description: 'Optional: Subdirectory path to scan (e.g., apps/api)'
        required: false
        type: string
      scan_mode:
        description: 'Scan mode (quick/full/nightly/baseline)'
        required: false
        default: 'full'
        type: choice
        options:
          - quick
          - full
          - nightly
          - baseline
      garak_target_type:
        description: 'Garak generator type (e.g. test, openai, huggingface)'
        required: false
        default: 'openai'
        type: string
      garak_target_name:
        description: 'Garak target model name (e.g. gpt-4o-mini)'
        required: false
        default: 'gpt-4o-mini'
        type: string
      garak_probes:
        description: 'Comma-separated Garak probes or probe groups'
        required: false
        default: 'promptinject,dan,knownbadsignatures,encoding,continuation'
        type: string
      # ── Per-tool toggles — leave unchecked to run all tools ──────────────
      skip_sbom:
        description: 'Skip Layer 1 - SBOM generation'
        required: false
        default: false
        type: boolean
      skip_trufflehog:
        description: 'Skip Layer 2 - Secret detection (TruffleHog)'
        required: false
        default: false
        type: boolean
      skip_sonar:
        description: 'Skip Layer 3 - Code quality (SonarQube)'
        required: false
        default: false
        type: boolean
      skip_clamav:
        description: 'Skip Layer 4 - Malware detection (ClamAV)'
        required: false
        default: false
        type: boolean
      skip_helm:
        description: 'Skip Layer 5 - Helm chart build'
        required: false
        default: false
        type: boolean
      skip_checkov:
        description: 'Skip Layer 6 - Infrastructure security (Checkov)'
        required: false
        default: false
        type: boolean
      skip_trivy:
        description: 'Skip Layer 7 - Container security (Trivy)'
        required: false
        default: false
        type: boolean
      skip_grype:
        description: 'Skip Layer 8 - Vulnerability detection (Grype)'
        required: false
        default: false
        type: boolean
      skip_xeol:
        description: 'Skip Layer 9 - End-of-life detection (Xeol)'
        required: false
        default: false
        type: boolean
      skip_anchore:
        description: 'Skip Layer 10 - Anchore security'
        required: false
        default: false
        type: boolean
      skip_api_discovery:
        description: 'Skip Layer 11 - API discovery'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-scan:
    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
      issues: write
    uses: MetroStar/epyon/.github/workflows/epyon-scan.yml@main
    with:
      scan_mode: ${{ github.event_name == 'schedule' && 'nightly' || inputs.scan_mode || 'full' }}
      subdirectory: ${{ inputs.subdirectory || '' }}
      garak_target_type: ${{ inputs.garak_target_type || 'openai' }}
      garak_target_name: ${{ inputs.garak_target_name || 'gpt-4o-mini' }}
      garak_probes: ${{ inputs.garak_probes || 'promptinject,dan,knownbadsignatures,encoding,continuation' }}
      skip_sbom: ${{ inputs.skip_sbom || false }}
      skip_trufflehog: ${{ inputs.skip_trufflehog || false }}
      skip_sonar: ${{ inputs.skip_sonar || false }}
      skip_clamav: ${{ inputs.skip_clamav || false }}
      skip_helm: ${{ inputs.skip_helm || false }}
      skip_checkov: ${{ inputs.skip_checkov || false }}
      skip_trivy: ${{ inputs.skip_trivy || false }}
      skip_grype: ${{ inputs.skip_grype || false }}
      skip_xeol: ${{ inputs.skip_xeol || false }}
      skip_anchore: ${{ inputs.skip_anchore || false }}
      skip_api_discovery: ${{ inputs.skip_api_discovery || false }}
    secrets: inherit
