name: Private Security Scan

# Top-level permissions: restrict default to read-only
permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  # checkov:skip=CKV_GHA_7:Workflow inputs control scan parameters not build artifacts; subdirectory and scan mode are security tool configurations
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional: Pull request number to scan (e.g., 123). If set, takes precedence over target_ref'
        required: false
        type: string
      target_ref:
        description: 'Optional: Branch/tag/commit to scan (e.g., feature/my-branch, refs/heads/main, a1b2c3d)'
        required: false
        type: string
      subdirectory:
        description: 'Optional: Subdirectory path to scan (e.g., apps/api)'
        required: false
        type: string
      scan_mode:
        description: 'Scan mode (quick/full/baseline)'
        required: false
        default: 'full'
        type: choice
        options:
          - quick
          - full
          - baseline
      fail_on_critical:
        description: 'Fail build on critical severity findings'
        required: false
        default: true
        type: boolean
      fail_on_high:
        description: 'Fail build on high severity findings'
        required: false
        default: true
        type: boolean
      warning_only:
        description: 'Report vulnerabilities but never fail the build'
        required: false
        default: false
        type: boolean
      garak_target_type:
        description: 'Garak generator type (for example: test, openai, huggingface)'
        required: false
        default: 'openai'
        type: choice
        options:
          - openai
          - test
          - huggingface
          - ollama
          - litellm
      garak_target_name:
        description: 'Garak target model name preset'
        required: false
        default: 'gpt-4o-mini'
        type: choice
        options:
          - gpt-4o-mini
          - gpt-4.1-mini
          - gpt-4o
          - gpt-4.1
          - llama3.1:8b
          - test.Blank
          - test.Repeat
      garak_target_name_custom:
        description: 'Optional custom Garak target model name (overrides preset when set)'
        required: false
        type: string
      garak_probes:
        description: 'Garak probe set'
        required: false
        default: 'promptinject'
        type: choice
        options:
          - promptinject
          - dan
          - encoding
          - malwaregen
          - knownbadsignatures
          - xss
          - lmrc
          - all
      skip_garak:
        description: 'Skip Garak LLM security probing (Layer 12)'
        required: false
        type: boolean
        default: false

env:
  # Trigger behavior:
  # - workflow_dispatch: use selected input
  # - pull_request: quick
  # - push (including post-merge) and schedule: full
  SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scan_mode || github.event_name == 'pull_request' && 'quick' || 'full' }}
  # For automatic triggers (push/PR/schedule): always fail on critical and high
  # For manual triggers: use workflow_dispatch inputs (default to true for both)
  FAIL_ON_CRITICAL: ${{ github.event_name != 'workflow_dispatch' && 'true' || github.event.inputs.fail_on_critical }}
  FAIL_ON_HIGH: ${{ github.event_name != 'workflow_dispatch' && 'true' || github.event.inputs.fail_on_high }}
  WARNING_ONLY: ${{ github.event.inputs.warning_only || 'false' }}
  # PR runs (especially from forks) often do not have access to repository
  # secrets. Default those runs to local test generator so Layer 12 still runs.
  GARAK_TARGET_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.garak_target_type || github.event_name == 'pull_request' && 'test' || 'openai' }}
  GARAK_TARGET_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.garak_target_name || github.event_name == 'pull_request' && 'test.Blank' || 'gpt-4o-mini' }}
  GARAK_PROBES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.garak_probes || 'promptinject' }}
  SKIP_GARAK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_garak || 'false' }}
  # Notification recipients: set the NOTIFY_USERS Actions variable in
  # Settings → Secrets and variables → Actions → Variables (comma-separated, no @)
  NOTIFY_USERS: ${{ vars.NOTIFY_USERS }}

jobs:
  security-scan:
    name: Run Epyon Security Analysis
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      issues: write
    
    steps:
      - name: Checkout This Repository
        uses: actions/checkout@v4
        with:
          path: target-repo
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.pr_number != '' && format('refs/pull/{0}/merge', github.event.inputs.pr_number) || github.event.inputs.target_ref) || github.ref }}
      
      - name: Checkout Epyon Security Scanner
        uses: actions/checkout@v4
        with:
          repository: MetroStar/epyon
          path: epyon
          fetch-depth: 1
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Docker Images
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-
      
      - name: Pull Security Tool Images
        run: |
          docker pull anchore/grype:latest &
          docker pull aquasec/trivy:latest &  
          docker pull trufflesecurity/trufflehog:latest &
          docker pull anchore/syft:latest &
          wait
          echo "All security tool images cached"
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-pip bats
          pip3 install pyyaml

      - name: Initialize Scan
        id: init-scan
        env:
          TARGET_NAME: ${{ github.event.repository.name }}
          GITHUB_ACTOR: ${{ github.actor }}
          SUBDIR: ${{ github.event.inputs.subdirectory }}
          GARAK_TARGET_NAME_CUSTOM_INPUT: ${{ github.event.inputs.garak_target_name_custom }}
        run: |
          cd epyon
          chmod +x scripts/shell/run-target-security-scan.sh

          EPYON_VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo "unknown")
          echo "Using Epyon version: $EPYON_VERSION"
          
          # Determine target directory and name based on subdirectory
          if [[ -n "$SUBDIR" ]]; then
            # Scanning subdirectory
            TARGET_DIR="${{ github.workspace }}/target-repo/$SUBDIR"
            TARGET_NAME=$(basename "$SUBDIR")
            echo "🎯 Scanning subdirectory: $SUBDIR"
          else
            # Scanning full repository
            TARGET_DIR="${{ github.workspace }}/target-repo"
            TARGET_NAME="$TARGET_NAME"
            echo "🎯 Scanning full repository: $TARGET_NAME"
          fi
          
          echo "TARGET_DIR=$TARGET_DIR" > /tmp/epyon-env
          GARAK_TARGET_NAME_RESOLVED="${GARAK_TARGET_NAME:-gpt-4o-mini}"
          if [[ -n "${GARAK_TARGET_NAME_CUSTOM_INPUT:-}" ]]; then
            GARAK_TARGET_NAME_RESOLVED="$GARAK_TARGET_NAME_CUSTOM_INPUT"
          fi

          echo "SCAN_MODE=$SCAN_MODE" >> /tmp/epyon-env
          echo "TARGET_NAME=$TARGET_NAME" >> /tmp/epyon-env
          echo "GITHUB_ACTOR=$GITHUB_ACTOR" >> /tmp/epyon-env
          echo "SUBDIR=$SUBDIR" >> /tmp/epyon-env
          echo "EPYON_VERSION=$EPYON_VERSION" >> /tmp/epyon-env
          echo "GARAK_TARGET_TYPE=${GARAK_TARGET_TYPE:-openai}" >> /tmp/epyon-env
          echo "GARAK_TARGET_NAME=$GARAK_TARGET_NAME_RESOLVED" >> /tmp/epyon-env
          echo "GARAK_PROBES=${GARAK_PROBES:-promptinject}" >> /tmp/epyon-env
          
          # Create scan directory
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          USERNAME="${GITHUB_ACTOR}"
          SCAN_NAME="${TARGET_NAME}_${USERNAME}_${TIMESTAMP}"
          SCAN_DIR="scans/${SCAN_NAME}"
          mkdir -p "$SCAN_DIR"
          echo "SCAN_DIR=$PWD/$SCAN_DIR" >> /tmp/epyon-env
          echo "SCAN_NAME=$SCAN_NAME" >> /tmp/epyon-env
          echo "scan_dir=$SCAN_DIR" >> $GITHUB_OUTPUT
          echo "scan_id=$SCAN_NAME" >> $GITHUB_OUTPUT
          echo "🚀 Initialized scan: $SCAN_NAME"
      
      - name: Run Security Layers (CI Orchestrator)
        id: run-scan
        continue-on-error: true
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_SONAR_IN_QUICK: "false"
          RUN_GARAK_IN_QUICK: "false"
        run: |
          chmod +x epyon/scripts/shell/run-epyon-scan-ci.sh
          ./epyon/scripts/shell/run-epyon-scan-ci.sh
      
      - name: Check Severity Gate
        id: severity-gate
        continue-on-error: true
        run: |
          cd epyon
          # Source environment variables from epyon-env
          if [ -f /tmp/epyon-env ]; then
            set -a
            source /tmp/epyon-env
            set +a
          fi
          export FAIL_ON_CRITICAL="${{ env.FAIL_ON_CRITICAL }}"
          export FAIL_ON_HIGH="${{ env.FAIL_ON_HIGH }}"
          export WARNING_ONLY="${{ env.WARNING_ONLY }}"
          chmod +x scripts/shell/check-severity-gate.sh
          ./scripts/shell/check-severity-gate.sh
      
      - name: Generate Reports & Dashboard
        if: always()
        run: |
          cd epyon
          if [ -f /tmp/epyon-env ]; then
            source /tmp/epyon-env
          fi
          SCAN_DIR="${{ steps.run-scan.outputs.scan_dir }}"
          echo "📊 Generating consolidated reports and dashboard..."
          echo "DEBUG: SCAN_DIR = $SCAN_DIR"
          echo "DEBUG: Before consolidation, manifest files:"
          ls -la "$SCAN_DIR"/scan-manifest* "$SCAN_DIR"/manifest-summary* 2>&1 || echo "Manifest files not found before consolidation!"
          chmod +x scripts/shell/consolidate-security-reports.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="$TARGET_DIR" ./scripts/shell/consolidate-security-reports.sh || echo "Report generation completed with warnings"
          echo "DEBUG: After consolidation, manifest files in consolidated-reports:"
          ls -la "$SCAN_DIR/consolidated-reports"/scan-manifest* "$SCAN_DIR/consolidated-reports"/manifest-summary* 2>&1 || echo "Manifest files not found in consolidated-reports!"
      
      - name: Fix Artifact Permissions
        if: always()
        run: |
          cd epyon
          SCAN_DIR="${{ steps.run-scan.outputs.scan_dir }}"
          if [ -d "$SCAN_DIR" ]; then
            echo "Fixing permissions for: $SCAN_DIR"
            # Change ownership to runner user first
            sudo chown -R runner:docker "$SCAN_DIR" || true
            # Then fix permissions
            sudo chmod -R a+r "$SCAN_DIR" || true
            sudo find "$SCAN_DIR" -type d -exec chmod a+rx {} \; || true
            # Verify permissions
            ls -la "$SCAN_DIR/clamav/" || true
          fi
      
      - name: Generate Summary
        if: always()
        run: |
          cd epyon
          if [ -f /tmp/epyon-env ]; then
            source /tmp/epyon-env
          fi
          SCAN_DIR="${{ steps.run-scan.outputs.scan_dir }}"
          GARAK_RESULTS_FILE="$SCAN_DIR/garak/garak-results.json"

          echo "**Epyon Version:** \`${EPYON_VERSION:-unknown}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🤖 Garak LLM Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f "$GARAK_RESULTS_FILE" ]; then
            GARAK_STATUS=$(jq -r '.status // "unknown"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "unknown")
            GARAK_TARGET_TYPE=$(jq -r '.target_type // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_TARGET_NAME=$(jq -r '.target_name // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_RUNTIME_TARGET=$(jq -r '.runtime_target // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_RUNTIME_CLASSIFICATION=$(jq -r '.runtime_classification // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_TARGET_ORIGIN=$(jq -r '.target_origin // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_PROBES=$(jq -r '.probes // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_EXIT_CODE=$(jq -r '.exit_code // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_HIT_LOG=$(jq -r '.hit_log // empty' "$GARAK_RESULTS_FILE" 2>/dev/null || true)
            GARAK_HIT_COUNT="0"
            if [ -n "$GARAK_HIT_LOG" ] && [ -f "$SCAN_DIR/garak/$GARAK_HIT_LOG" ]; then
              GARAK_HIT_COUNT=$(wc -l < "$SCAN_DIR/garak/$GARAK_HIT_LOG" | tr -d '[:space:]')
            fi
            echo "- Status: \`$GARAK_STATUS\`" >> $GITHUB_STEP_SUMMARY
            echo "- Target: \`$GARAK_TARGET_TYPE\` / \`$GARAK_TARGET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- Runtime target: \`$GARAK_RUNTIME_TARGET\`" >> $GITHUB_STEP_SUMMARY
            echo "- Runtime class: \`$GARAK_RUNTIME_CLASSIFICATION\`" >> $GITHUB_STEP_SUMMARY
            echo "- Target origin: \`$GARAK_TARGET_ORIGIN\`" >> $GITHUB_STEP_SUMMARY
            echo "- Probes: \`$GARAK_PROBES\`" >> $GITHUB_STEP_SUMMARY
            echo "- Probe hits: \`$GARAK_HIT_COUNT\`" >> $GITHUB_STEP_SUMMARY
            echo "- Exit code: \`$GARAK_EXIT_CODE\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Garak results were not generated in this run." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md" ]; then
            cat "$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload Complete Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.run-scan.outputs.scan_id }}
          path: epyon/${{ steps.run-scan.outputs.scan_dir }}/
          retention-days: 30

      
      - name: Check for Critical/High Vulnerabilities
        id: check-severity
        if: always()
        run: |
          cd epyon
          SCAN_DIR="${{ steps.run-scan.outputs.scan_dir }}"
          SUMMARY="$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md"
          
          if [ -f "$SUMMARY" ]; then
            CRITICAL=$(grep -oP 'Critical:\s*\K\d+' "$SUMMARY" || echo "0")
            HIGH=$(grep -oP 'High:\s*\K\d+' "$SUMMARY" || echo "0")
            
            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high=$HIGH" >> $GITHUB_OUTPUT
            
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "has_issues=true" >> $GITHUB_OUTPUT
            else
              echo "has_issues=false" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'epyon/${{ steps.run-scan.outputs.scan_dir }}/consolidated-reports/markdown-reports/executive-summary.md';
            
            if (fs.existsSync(summaryPath)) {
              const summary = fs.readFileSync(summaryPath, 'utf8');
              const critical = '${{ steps.check-severity.outputs.critical }}';
              const high = '${{ steps.check-severity.outputs.high }}';
              
              let emoji = '✅';
              let status = 'No critical or high severity issues found';
              
              if (critical > 0 || high > 0) {
                emoji = '⚠️';
                status = `Found ${critical} critical and ${high} high severity issues`;
              }
              
              // Build notification mentions from NOTIFY_USERS
              const notifyUsers = '${{ env.NOTIFY_USERS }}'.split(',').map(u => `@${u.trim()}`).join(' ');
              
              const comment = `## ${emoji} Epyon Security Scan Results
              
              ${status}
              
              **Triggered by:** @${{ github.actor }}
              **Scan mode:** ${{ env.SCAN_MODE }}
              **Notifying:** ${notifyUsers}
              
              <details>
              <summary>📊 Executive Summary</summary>
              
              ${summary}
              
              </details>
              
              ### 📦 Artifacts
              - [Security Dashboard](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              - [HTML Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              - [Markdown Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
      
      - name: Create Scan Notification Issue
        if: always() && steps.check-severity.outputs.has_issues == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const notifyUsers = '${{ env.NOTIFY_USERS }}'.split(',').map(u => `@${u.trim()}`).join(' ');
            const triggeredBy = '@${{ github.actor }}';
            const repository = '${{ github.repository }}';
            const scanMode = '${{ env.SCAN_MODE }}';
            const runUrl = `https://github.com/${repository}/actions/runs/${{ github.run_id }}`;
            const critical = '${{ steps.check-severity.outputs.critical }}' || '0';
            const high = '${{ steps.check-severity.outputs.high }}' || '0';
            
            // Determine trigger type
            let triggerType = 'Manual';
            if ('${{ github.event_name }}' === 'push') triggerType = 'Push to ${{ github.ref_name }}';
            else if ('${{ github.event_name }}' === 'pull_request') triggerType = 'Pull Request #${{ github.event.pull_request.number }}';
            else if ('${{ github.event_name }}' === 'schedule') triggerType = 'Scheduled Scan';
            
            // Determine severity emoji and status
            let severityEmoji = '✅';
            let severityStatus = 'Clean';
            let labels = ['security-scan', 'epyon'];
            
            if (parseInt(critical) > 0) {
              severityEmoji = '🔴';
              severityStatus = 'Critical Issues Found';
              labels.push('critical', 'security');
            } else if (parseInt(high) > 0) {
              severityEmoji = '🟠';
              severityStatus = 'High Risk';
              labels.push('high-severity', 'security');
            } else {
              labels.push('no-issues');
            }
            
            // Read executive summary if available
            const summaryPath = 'epyon/${{ steps.run-scan.outputs.scan_dir }}/consolidated-reports/markdown-reports/executive-summary.md';
            let executiveSummary = '';
            if (fs.existsSync(summaryPath)) {
              executiveSummary = fs.readFileSync(summaryPath, 'utf8');
            }
            
            const issueBody = `${severityEmoji} **Security Scan Complete - ${severityStatus}**
            
            **Repository:** \`${repository}\`
            **Scan Mode:** \`${scanMode}\`
            **Trigger:** ${triggerType}
            **Triggered by:** ${triggeredBy}
            **Notifying:** ${notifyUsers}
            
            ---
            
            ### 📊 Security Findings Summary
            
            | Severity | Count |
            |----------|-------|
            | 🔴 Critical | ${critical} |
            | 🟠 High | ${high} |
            
            ${executiveSummary ? `\n### 📋 Executive Summary\n\n${executiveSummary}\n` : ''}
            
            ---
            
            ### 📦 Scan Artifacts
            
            - [View Workflow Run](${runUrl})
            - [Download Security Dashboard](${runUrl})
            - [Download Full Report](${runUrl})
            
            ### 🔗 Next Steps
            
            ${parseInt(critical) > 0 || parseInt(high) > 0 ? 
              '1. ⚠️ **Review critical and high-severity findings immediately**\n2. Download the interactive security dashboard\n3. Prioritize remediation based on severity\n4. Update dependencies and configurations as needed' :
              '1. ✅ Review scan results for informational findings\n2. Monitor for new vulnerabilities\n3. Keep dependencies up to date'}
            
            ---
            *🤖 Automated notification from Epyon Security Scanner*
            `;
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${severityEmoji} Security Scan: ${repository.split('/')[1]} - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: labels
            });
            
            console.log(`Created issue #${issue.data.number}: ${issue.data.html_url}`);
      
      - name: Fail on Critical Vulnerabilities
        if: always() && steps.check-severity.outputs.critical > 0
        run: |
          echo "::error::Found ${{ steps.check-severity.outputs.critical }} critical vulnerabilities"
          exit 1
