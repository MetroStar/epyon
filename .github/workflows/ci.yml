name: CI

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main
      - test

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: epyon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: BATS tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pytest pyyaml

      - name: Run shell test suite
        run: EPYON_SKIP_PYTHON_TESTS=true bash run-tests.sh

      - name: Run Python parity tests
        run: python -m pytest tests/python -vv

  security-scan:
    name: Security scan
    needs: test
    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
      issues: write
    uses: ./.github/workflows/epyon-scan.yml
    with:
      scan_mode: ${{ github.event_name == 'push' && 'full' || 'quick' }}
      skip_garak: true
      # Note: STIG (Layer 13) is opt-in by default. Set run_stig: true to enable.
