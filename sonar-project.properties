sonar.projectKey=MetroStar_epyon
sonar.organization=metrostar

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=epyon
#sonar.projectVersion=1.0

# Source directories
sonar.sources=scripts/shell
sonar.tests=tests/shell

# Exclusions
sonar.exclusions=**/node_modules/**,**/*.log,**/coverage/**,**/scans/**,**/baseline/scans/**,.bats/**,**/build-wrapper-dump.json

sonar.coverageReportPaths=coverage/sonar-coverage.xml

# JavaScript/TypeScript coverage (Vite/Vitest lcov output)
# Epyon itself has no JS sources; populated automatically by run-sonar-analysis.sh
# when scanning target repos that have coverage/lcov.info output
#sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
