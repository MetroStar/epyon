name: Baseline Security Scan

on:
  schedule:
    # Runs every 89 days at 2:00 AM UTC (keeps baseline artifact alive)
    - cron: '0 2 */89 * *'
  # checkov:skip=CKV_GHA_7:Workflow inputs control scan behavior not build output; failure thresholds are security controls
  workflow_dispatch:
    inputs:
      fail_on_critical:
        description: 'Fail build on critical severity findings'
        required: false
        default: false
        type: boolean
      fail_on_high:
        description: 'Fail build on high severity findings'
        required: false
        default: false
        type: boolean

jobs:
  baseline-scan:
    name: Baseline Security Scan
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      issues: write
    
    steps:
      - name: Checkout This Repository
        uses: actions/checkout@v4
        with:
          path: target-repo
          fetch-depth: 0
      
      - name: Checkout Epyon Security Scanner
        uses: actions/checkout@v4
        with:
          repository: MetroStar/epyon
          path: epyon
          fetch-depth: 1
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Docker Images
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-
      
      - name: Pull Security Tool Images
        run: |
          docker pull anchore/grype:latest &
          docker pull aquasec/trivy:latest &
          docker pull trufflesecurity/trufflehog:latest &
          docker pull anchore/syft:latest &
          wait
          echo "All security tool images cached"
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-pip
          pip3 install pyyaml
      
      - name: Initialize Baseline Scan
        id: init-scan
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          TARGET_NAME: ${{ github.event.repository.name }}
          PRIMARY_BASELINE_IMAGE: dhi/caddy:latest
        run: |
          cd epyon
          chmod +x scripts/shell/run-target-security-scan.sh
          
          TARGET_DIR="${{ github.workspace }}/target-repo"
          
          echo "TARGET_DIR=$TARGET_DIR" > /tmp/epyon-env
          echo "SCAN_MODE=baseline" >> /tmp/epyon-env
          echo "TARGET_NAME=$TARGET_NAME" >> /tmp/epyon-env
          echo "GITHUB_ACTOR=$GITHUB_ACTOR" >> /tmp/epyon-env
          echo "PRIMARY_BASELINE_IMAGE=$PRIMARY_BASELINE_IMAGE" >> /tmp/epyon-env
          
          # Capture baseline commit SHA
          cd "$TARGET_DIR"
          BASELINE_SHA=$(git rev-parse HEAD)
          BASELINE_SHA_SHORT=$(git rev-parse --short HEAD)
          cd "${{ github.workspace }}/epyon"
          
          echo "BASELINE_SHA=$BASELINE_SHA" >> /tmp/epyon-env
          echo "BASELINE_SHA_SHORT=$BASELINE_SHA_SHORT" >> /tmp/epyon-env
          
          # Create scan directory with baseline SHA
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          USERNAME="${GITHUB_ACTOR}"
          SCAN_NAME="baseline_${TARGET_NAME}_${BASELINE_SHA_SHORT}_${USERNAME}_${TIMESTAMP}"
          SCAN_DIR="scans/${SCAN_NAME}"
          mkdir -p "$SCAN_DIR"
          echo "SCAN_DIR=$PWD/$SCAN_DIR" >> /tmp/epyon-env
          echo "SCAN_NAME=$SCAN_NAME" >> /tmp/epyon-env
          echo "scan_dir=$SCAN_DIR" >> $GITHUB_OUTPUT
          
          # Write baseline metadata
          cat > "$SCAN_DIR/baseline-metadata.json" << EOF
          {
            "scan_name": "${SCAN_NAME}",
            "repository": "${{ github.repository }}",
            "baseline_sha": "${BASELINE_SHA}",
            "baseline_sha_short": "${BASELINE_SHA_SHORT}",
            "scan_date": "${TIMESTAMP}",
            "scan_type": "baseline",
            "github_actor": "${GITHUB_ACTOR}",
            "scan_layers": ["SBOM", "Secrets", "IaC", "Trivy", "Grype", "Xeol"]
          }
          EOF
          
          echo "✅ Initialized baseline scan: ${SCAN_NAME}"
          echo "📌 Baseline SHA: ${BASELINE_SHA}"
      
      - name: Layer 1 - SBOM Generation
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          cd epyon
          echo "📋 Layer 1: Software Bill of Materials (SBOM)"
          chmod +x scripts/shell/run-complete-sbom-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-complete-sbom-scan.sh || echo "SBOM scan completed with warnings"
      
      - name: Layer 2 - Secret Detection (TruffleHog)
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          cd epyon
          echo "🔐 Layer 2: Secret Detection"
          chmod +x scripts/shell/run-trufflehog-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-trufflehog-scan.sh filesystem || echo "TruffleHog scan completed with warnings"
      
      - name: Layer 6 - Infrastructure Security (Checkov)
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          cd epyon
          echo "☸️ Layer 6: Infrastructure Security"
          chmod +x scripts/shell/run-checkov-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-checkov-scan.sh || echo "Checkov scan completed with warnings"
      
      - name: Layer 7 - Container Security (Trivy)
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          cd epyon
          echo "🛡️ Layer 7: Container Security (Trivy)"
          chmod +x scripts/shell/run-trivy-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-trivy-scan.sh filesystem || echo "Trivy scan completed with warnings"
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" PRIMARY_BASELINE_IMAGE="${PRIMARY_BASELINE_IMAGE}" ./scripts/shell/run-trivy-scan.sh base || echo "Trivy base image scan completed with warnings"
      
      - name: Layer 8 - Vulnerability Detection (Grype)
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          cd epyon
          echo "🔍 Layer 8: Vulnerability Detection (Grype)"
          chmod +x scripts/shell/run-grype-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" ./scripts/shell/run-grype-scan.sh sbom || echo "Grype SBOM scan completed with warnings"
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" PRIMARY_BASELINE_IMAGE="${PRIMARY_BASELINE_IMAGE}" ./scripts/shell/run-grype-scan.sh images || echo "Grype image scan completed with warnings"
      
      - name: Layer 9 - End-of-Life Detection (Xeol)
        continue-on-error: true
        run: |
          source /tmp/epyon-env
          cd epyon
          echo "⏰ Layer 9: End-of-Life Detection (Xeol)"
          chmod +x scripts/shell/run-xeol-scan.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" PRIMARY_BASELINE_IMAGE="${PRIMARY_BASELINE_IMAGE}" ./scripts/shell/run-xeol-scan.sh || echo "Xeol scan completed with warnings"
      
      - name: Check Severity Gate
        id: severity-gate
        if: github.event.inputs.fail_on_critical == 'true' || github.event.inputs.fail_on_high == 'true'
        run: |
          cd epyon
          # Source environment variables from epyon-env
          if [ -f /tmp/epyon-env ]; then
            set -a
            source /tmp/epyon-env
            set +a
          fi
          export FAIL_ON_CRITICAL="${{ github.event.inputs.fail_on_critical == 'true' }}"
          export FAIL_ON_HIGH="${{ github.event.inputs.fail_on_high == 'true' }}"
          export WARNING_ONLY="true"
          chmod +x scripts/shell/check-severity-gate.sh
          ./scripts/shell/check-severity-gate.sh
      
      - name: Display Vulnerability Summary
        if: always()
        run: |
          source /tmp/epyon-env
          cd epyon
          echo "📊 Security Vulnerability Summary"
          echo "═══════════════════════════════════════════════════════════════"
          
          FINDINGS_SUMMARY="$SCAN_DIR/security-findings-summary.json"
          if [ -f "$FINDINGS_SUMMARY" ]; then
            CRITICAL=$(jq -r '.summary.total_critical // 0' "$FINDINGS_SUMMARY" 2>/dev/null || echo "0")
            HIGH=$(jq -r '.summary.total_high // 0' "$FINDINGS_SUMMARY" 2>/dev/null || echo "0")
            MEDIUM=$(jq -r '.summary.total_medium // 0' "$FINDINGS_SUMMARY" 2>/dev/null || echo "0")
            LOW=$(jq -r '.summary.total_low // 0' "$FINDINGS_SUMMARY" 2>/dev/null || echo "0")
            
            echo "🔴 Critical: $CRITICAL"
            echo "🟠 High: $HIGH"
            echo "🟡 Medium: $MEDIUM"
            echo "🟢 Low: $LOW"
            echo ""
            
            # Display critical and high vulnerabilities
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "⚠️  CRITICAL & HIGH SEVERITY VULNERABILITIES:"
              echo "───────────────────────────────────────────────────────────────"
              jq -r '.findings[] | select(.severity == "CRITICAL" or .severity == "HIGH") | "\(.severity) | \(.vulnerability_id // .cve_id // "N/A") | \(.package_name // "N/A") | \(.tool)"' "$FINDINGS_SUMMARY" 2>/dev/null | head -50 || echo "Details in dashboard"
              echo ""
            fi
            
            # Show suppressions if any
            if [ -f "$SCAN_DIR/suppressed-findings.md" ]; then
              SUPP_COUNT=$(grep -c "^## Suppressed:" "$SCAN_DIR/suppressed-findings.md" 2>/dev/null || echo "0")
              if [ "$SUPP_COUNT" -gt 0 ]; then
                echo "🔕 Suppressed: $SUPP_COUNT finding(s) via .epyon-ignore.yml"
                echo ""
              fi
            fi
          fi
          
          echo "📊 Full details available in the security dashboard artifact"
          echo "═══════════════════════════════════════════════════════════════"
      
      - name: Generate Baseline Reports & Dashboard
        if: always()
        run: |
          source /tmp/epyon-env
          cd epyon
          echo "📊 Generating baseline reports and dashboard..."
          chmod +x scripts/shell/consolidate-security-reports.sh
          SCAN_DIR="$SCAN_DIR" ./scripts/shell/consolidate-security-reports.sh || echo "Report generation completed with warnings"
      
      - name: Find Scan Directory
        id: download-previous
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: baseline-scan.yml
          name: baseline-security-scan
          path: epyon/scans/previous-baseline/
          if_no_artifact_found: warn
      
      - name: Compare with Previous Baseline
        id: compare-baseline
        if: always() && steps.download-previous.outcome == 'success'
        run: |
          cd epyon
          source /tmp/epyon-env
          CURRENT_SCAN="${{ steps.find-scan.outputs.scan_dir }}"
          PREVIOUS_SCAN="scans/previous-baseline"
          
          echo "## 📊 Baseline Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Compare metadata
          if [ -f "$CURRENT_SCAN/baseline-metadata.json" ] && [ -f "$PREVIOUS_SCAN/baseline-metadata.json" ]; then
            CURRENT_SHA=$(jq -r '.baseline_sha_short' "$CURRENT_SCAN/baseline-metadata.json" 2>/dev/null || echo "unknown")
            PREVIOUS_SHA=$(jq -r '.baseline_sha_short' "$PREVIOUS_SCAN/baseline-metadata.json" 2>/dev/null || echo "unknown")
            
            echo "**Current SHA:** \`${CURRENT_SHA}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Previous SHA:** \`${PREVIOUS_SHA}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Compare finding counts from consolidated reports
          if [ -f "$CURRENT_SCAN/consolidated-reports/consolidated-findings.json" ] && [ -f "$PREVIOUS_SCAN/consolidated-reports/consolidated-findings.json" ]; then
            echo "### Finding Changes" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Extract counts
            CURR_CRITICAL=$(jq '[.[] | select(.severity == "CRITICAL" or .severity == "Critical")] | length' "$CURRENT_SCAN/consolidated-reports/consolidated-findings.json" 2>/dev/null || echo "0")
            PREV_CRITICAL=$(jq '[.[] | select(.severity == "CRITICAL" or .severity == "Critical")] | length' "$PREVIOUS_SCAN/consolidated-reports/consolidated-findings.json" 2>/dev/null || echo "0")
            
            CURR_HIGH=$(jq '[.[] | select(.severity == "HIGH" or .severity == "High")] | length' "$CURRENT_SCAN/consolidated-reports/consolidated-findings.json" 2>/dev/null || echo "0")
            PREV_HIGH=$(jq '[.[] | select(.severity == "HIGH" or .severity == "High")] | length' "$PREVIOUS_SCAN/consolidated-reports/consolidated-findings.json" 2>/dev/null || echo "0")
            
            CURR_MEDIUM=$(jq '[.[] | select(.severity == "MEDIUM" or .severity == "Medium")] | length' "$CURRENT_SCAN/consolidated-reports/consolidated-findings.json" 2>/dev/null || echo "0")
            PREV_MEDIUM=$(jq '[.[] | select(.severity == "MEDIUM" or .severity == "Medium")] | length' "$PREVIOUS_SCAN/consolidated-reports/consolidated-findings.json" 2>/dev/null || echo "0")
            
            # Calculate differences
            CRITICAL_DIFF=$((CURR_CRITICAL - PREV_CRITICAL))
            HIGH_DIFF=$((CURR_HIGH - PREV_HIGH))
            MEDIUM_DIFF=$((CURR_MEDIUM - PREV_MEDIUM))
            
            # Format with trend indicators
            [ $CRITICAL_DIFF -gt 0 ] && CRIT_TREND="🔴 +${CRITICAL_DIFF}" || [ $CRITICAL_DIFF -lt 0 ] && CRIT_TREND="🟢 ${CRITICAL_DIFF}" || CRIT_TREND="➖ ${CRITICAL_DIFF}"
            [ $HIGH_DIFF -gt 0 ] && HIGH_TREND="🔴 +${HIGH_DIFF}" || [ $HIGH_DIFF -lt 0 ] && HIGH_TREND="🟢 ${HIGH_DIFF}" || HIGH_TREND="➖ ${HIGH_DIFF}"
            [ $MEDIUM_DIFF -gt 0 ] && MED_TREND="🟡 +${MEDIUM_DIFF}" || [ $MEDIUM_DIFF -lt 0 ] && MED_TREND="🟢 ${MEDIUM_DIFF}" || MED_TREND="➖ ${MEDIUM_DIFF}"
            
            echo "| Severity | Previous | Current | Change |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|----------|---------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | ${PREV_CRITICAL} | ${CURR_CRITICAL} | ${CRIT_TREND} |" >> $GITHUB_STEP_SUMMARY
            echo "| High     | ${PREV_HIGH} | ${CURR_HIGH} | ${HIGH_TREND} |" >> $GITHUB_STEP_SUMMARY
            echo "| Medium   | ${PREV_MEDIUM} | ${CURR_MEDIUM} | ${MED_TREND} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "✅ Baseline comparison complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload Baseline Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-security-scan
          path: epyon/${{ steps.find-scan.outputs.scan_dir }}/
          retention-days: 90
      
      - name: Generate Summary
        if: always()
        run: |
          cd epyon
          source /tmp/epyon-env
          SCAN_DIR="${{ steps.find-scan.outputs.scan_dir }}"
          echo "## 🎯 Baseline Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Baseline SHA:** \`$BASELINE_SHA_SHORT\` (\`$BASELINE_SHA\`)" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Type:** Baseline (reduced scan for initial assessment)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📌 Baseline Reference" >> $GITHUB_STEP_SUMMARY
          echo "Use this SHA for future scan comparisons:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$BASELINE_SHA" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Baseline Scan Layers" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 SBOM Generation" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 Secret Detection" >> $GITHUB_STEP_SUMMARY
          echo "- ☸️ Infrastructure Security" >> $GITHUB_STEP_SUMMARY
          echo "- 🛡️ Container Security (Trivy)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Vulnerability Detection (Grype)" >> $GITHUB_STEP_SUMMARY
          echo "- ⏰ End-of-Life Detection (Xeol)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md" ]; then
            cat "$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md" >> $GITHUB_STEP_SUMMARY
          fi
