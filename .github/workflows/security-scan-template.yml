name: Security Scan with Webhook Support

# This workflow calls the reusable Epyon security scan workflow and forwards
# webhook configuration for real-time progress notifications to Barbatos.
#
# Copy this file to: .github/workflows/security-scan.yml

permissions:
  contents: read

# checkov:skip=CKV_GHA_7:Workflow inputs control scan parameters and webhook configuration, not build artifacts or output
on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan mode (quick/full/nightly/stig)'
        required: false
        default: 'full'
        type: string
      subdirectory:
        description: 'Optional: Subdirectory to scan'
        required: false
        default: ''
        type: string
      # Webhook configuration inputs (required for Barbatos integration)
      epyon_callback_url:
        description: 'Webhook URL for progress notifications'
        required: false
        default: ''
        type: string
      epyon_job_id:
        description: 'Job identifier for webhook correlation'
        required: false
        default: ''
        type: string
      epyon_webhook_secret:
        description: 'Shared secret for webhook HMAC validation'
        required: false
        default: ''
        type: string
  
  push:
    branches:
      - main
      - develop
  
  pull_request:
    branches:
      - main
      - develop
  
  schedule:
    # Run nightly scan at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-scan:
    name: Epyon Security Scan
    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
      issues: write
      id-token: write
    uses: MetroStar/epyon/.github/workflows/epyon-scan.yml@main
    with:
      scan_mode: ${{ inputs.scan_mode || 'full' }}
      subdirectory: ${{ inputs.subdirectory || '' }}
      # Forward webhook configuration to Epyon
      epyon_callback_url: ${{ inputs.epyon_callback_url || '' }}
      epyon_job_id: ${{ inputs.epyon_job_id || '' }}
      epyon_webhook_secret: ${{ inputs.epyon_webhook_secret || '' }}
      # Optional: customize scan behavior
      fail_on_critical: true
      fail_on_high: true
      warning_only: false
    secrets:
      ECR_SCAN_AWS_ACCESS_KEY_ID: ${{ secrets.ECR_SCAN_AWS_ACCESS_KEY_ID }}
      ECR_SCAN_AWS_SECRET_ACCESS_KEY: ${{ secrets.ECR_SCAN_AWS_SECRET_ACCESS_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
