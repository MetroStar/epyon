# Epyon Security Findings Ignore File
# Suppressions for security findings within Epyon itself

version: "1.0"

ignores:
  - type: path
    value: "tests/fixtures/self-assessment/**"
    reason: >
      Deliberately vulnerable self-assessment fixture (planted CVEs,
      secrets, IaC misconfigs, malicious pickle, typosquat model name,
      incomplete model card, insecure inference configs) used by
      scripts/shell/run-self-assessment.sh to validate that every Epyon
      scanner layer is actually detecting what it's supposed to. These
      findings are intentional and expected — see
      tests/fixtures/self-assessment/FIXTURE.md.
    approved_by: "rnelson"

  - type: path
    value: "tmp/**"
    reason: >
      Epyon's own scratch workspace for web-UI-driven scans (per-job git
      clones at tmp/clone-<job_id> and zip uploads at tmp/upload-*), created
      by web/api/jobs.py and web/api/main.py. These are scan *targets*
      belonging to other, unrelated repositories/apps — not part of the
      Epyon codebase — and leftover/stale clones must never be traversed
      (e.g. for Dockerfile FROM-line auto-discovery) when self-assessing
      Epyon itself, or unrelated base images and findings bleed into
      Epyon's own scan results.
    approved_by: "rnelson"

  - type: path
    value: "scans/**"
    reason: >
      Epyon's own scan output directory (previous runs' JSON/markdown
      reports and any extracted build/ context). Not source code — must
      never be treated as part of the codebase being scanned during
      self-assessment.
    approved_by: "rnelson"

  - type: package
    value: "transformers@4.57.6"
    reason: >
      transformers==4.57.6 is pinned only in test fixtures
      (tests/fixtures/pip-audit/clean-ml/requirements.txt and
      tests/fixtures/pip-audit/typosquat-ml/requirements.txt) used to exercise the
      ML-aware pip-audit scanner; it is not a real Epyon runtime dependency. 4.57.6 is
      also the latest version currently published on PyPI, so there is no newer
      version to pin to for CVE-2026-4372 / CVE-2026-5241 / CVE-2026-9856
      (GHSA-29pf-2h5f-8g72, GHSA-fgcw-684q-jj6r, GHSA-xrqw-3rrv-vx5w).
    approved_by: "rnelson"
    expires: "2027-03-31"

  - type: package
    value: "bsdutils@1:2.41.5-0+deb13u1"
    reason: >
      Debian 13 (trixie) base-image package in python:3.12-slim with a
      HIGH CVE and no fixed version published yet by Debian; `apt-get upgrade`
      in the Dockerfile already installs the latest available. Re-evaluate
      when Debian ships a patch.
    approved_by: "rnelson"
    expires: "2027-01-31"

