name: Private Security Scan

# Epyon private-repo scanner entrypoint.
# This workflow delegates execution to the local reusable workflow.

permissions:
  contents: read

on:
  schedule:
    # Nightly run at 2 AM UTC
    - cron: '0 2 * * *'
  # checkov:skip=CKV_GHA_7:Workflow inputs control scan parameters not build artifacts
  workflow_dispatch:
    inputs:
      subdirectory:
        description: 'Optional: Subdirectory path to scan (e.g., apps/api)'
        required: false
        type: string
      scan_mode:
        description: 'Scan mode (quick/full/nightly/baseline)'
        required: false
        default: 'full'
        type: choice
        options:
          - quick
          - full
          - nightly
          - baseline
      epyon_branch:
        description: 'Epyon branch to run against (main = production, test = staging)'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - test
      garak_target_type:
        description: 'Garak generator type (e.g. test, openai, huggingface)'
        required: false
        default: 'openai'
        type: string
      garak_target_name:
        description: 'Garak target model name (e.g. gpt-4o-mini)'
        required: false
        default: 'gpt-4o-mini'
        type: string
      garak_probes:
        description: 'Garak probe set'
        required: false
        default: 'promptinject,dan,knownbadsignatures,encoding,continuation'
        type: choice
        options:
          - promptinject,dan,knownbadsignatures,encoding,continuation
          - promptinject
          - dan
          - encoding
          - knownbadsignatures
          - xss
          - lmrc
          - all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-scan-main:
    if: github.event_name == 'schedule' || inputs.epyon_branch == 'main' || inputs.epyon_branch == ''
    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
      issues: write
    uses: MetroStar/epyon/.github/workflows/epyon-scan.yml@main
    with:
      scan_mode: ${{ github.event_name == 'schedule' && 'nightly' || inputs.scan_mode || 'full' }}
      subdirectory: ${{ inputs.subdirectory || '' }}
      garak_target_type: ${{ inputs.garak_target_type || 'openai' }}
      garak_target_name: ${{ inputs.garak_target_name || 'gpt-4o-mini' }}
      garak_probes: ${{ inputs.garak_probes || 'promptinject' }}
    secrets: inherit

  security-scan-test:
    if: github.event_name != 'schedule' && inputs.epyon_branch == 'test'
    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
      issues: write
    uses: MetroStar/epyon/.github/workflows/epyon-scan.yml@test
    with:
      scan_mode: ${{ inputs.scan_mode || 'full' }}
      subdirectory: ${{ inputs.subdirectory || '' }}
      garak_target_type: ${{ inputs.garak_target_type || 'openai' }}
      garak_target_name: ${{ inputs.garak_target_name || 'gpt-4o-mini' }}
      garak_probes: ${{ inputs.garak_probes || 'promptinject' }}
    secrets: inherit
