name: CI

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main
      - test

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: epyon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: BATS tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pytest pyyaml -r web/api/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check web bundle is up to date
        working-directory: web
        run: npm ci && npm run check

      - name: Run shell test suite
        run: EPYON_SKIP_PYTHON_TESTS=true bash run-tests.sh

      - name: Run Python parity tests
        run: python -m pytest tests/python -vv

  security-scan:
    name: Security scan
    needs: test
    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
      issues: write
      id-token: write
    uses: ./.github/workflows/epyon-scan.yml
    with:
      scanner_ref: ${{ github.sha }}
      scan_mode: ${{ github.event_name == 'push' && 'full' || 'quick' }}
      skip_garak: true
      # Note: STIG (Layer 13) is opt-in by default. Set run_stig: true to enable.
