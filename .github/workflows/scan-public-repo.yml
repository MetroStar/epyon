name: Scan Public Repository

permissions:
  contents: read

# checkov:skip=CKV_GHA_7:Workflow inputs are required for user-specified repository scanning and do not affect SLSA build provenance
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Git repository URL to scan'
        required: true
        type: string
      pr_number:
        description: 'Optional: Pull request number to scan (GitHub repos). If set, takes precedence over target_ref'
        required: false
        type: string
      target_ref:
        description: 'Optional: Branch/tag/commit to scan (e.g., feature/my-branch, refs/heads/main, a1b2c3d)'
        required: false
        type: string
      subdirectory:
        description: 'Optional: Subdirectory path within repository to scan (e.g., apps/api)'
        required: false
        type: string
      scan_mode:
        description: 'Scan mode'
        required: false
        default: 'full'
        type: choice
        options:
          - quick
          - full
          - baseline
      fail_on_critical:
        description: 'Fail build on critical severity findings'
        required: false
        default: true
        type: boolean
      fail_on_high:
        description: 'Fail build on high severity findings'
        required: false
        default: true
        type: boolean
      warning_only:
        description: 'Report vulnerabilities but never fail the build'
        required: false
        default: false
        type: boolean
      garak_target_type:
        description: 'Garak generator type (for example: test, openai, huggingface)'
        required: false
        default: 'openai'
        type: choice
        options:
          - openai
          - test
          - huggingface
          - ollama
          - litellm
      garak_target_name:
        description: 'Garak target model name preset'
        required: false
        default: 'gpt-4o-mini'
        type: choice
        options:
          - gpt-4o-mini
          - gpt-4.1-mini
          - gpt-4o
          - gpt-4.1
          - llama3.1:8b
          - test.Blank
          - test.Repeat
      garak_probes:
        description: 'Garak probe set'
        required: false
        default: 'promptinject'
        type: choice
        options:
          - promptinject
          - dan
          - encoding
          - malwaregen
          - knownbadsignatures
          - xss
          - lmrc
          - all
      skip_garak:
        description: 'Skip Garak LLM security probing (Layer 12)'
        required: false
        type: boolean
        default: false
      create_jira_tickets:
        description: 'Create JIRA tickets for critical and high severity findings'
        required: false
        default: false
        type: boolean
      jira_issue_type:
        description: 'JIRA issue type for created tickets'
        required: false
        default: 'Bug'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  external-scan:
    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
      issues: write
    uses: ./.github/workflows/epyon-scan.yml
    with:
      repository_url: ${{ inputs.repository }}
      pr_number: ${{ inputs.pr_number || '' }}
      target_ref: ${{ inputs.target_ref || '' }}
      subdirectory: ${{ inputs.subdirectory || '' }}
      scan_mode: ${{ inputs.scan_mode || 'full' }}
      fail_on_critical: ${{ inputs.fail_on_critical != false }}
      fail_on_high: ${{ inputs.fail_on_high != false }}
      warning_only: ${{ inputs.warning_only == true }}
      garak_target_type: ${{ inputs.garak_target_type || 'openai' }}
      garak_target_name: ${{ inputs.garak_target_name || 'gpt-4o-mini' }}
      garak_probes: ${{ inputs.garak_probes || 'promptinject' }}
      skip_garak: ${{ inputs.skip_garak == true }}
      create_jira_tickets: true
      jira_issue_type: ${{ inputs.jira_issue_type || 'Bug' }}
    secrets: inherit
