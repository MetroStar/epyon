name: Private Security Scan

# Epyon private-repo scanner entrypoint.
# This workflow delegates execution to the local reusable workflow.

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  # checkov:skip=CKV_GHA_7:Workflow inputs control scan parameters not build artifacts
  workflow_dispatch:
    inputs:
      subdirectory:
        description: 'Optional: Subdirectory path to scan (e.g., apps/api)'
        required: false
        type: string
      scan_mode:
        description: 'Scan mode (quick/full/nightly/baseline)'
        required: false
        default: 'full'
        type: choice
        options:
          - quick
          - full
          - nightly
          - baseline
      fail_on_critical:
        description: 'Fail build on critical severity findings'
        required: false
        default: false
        type: boolean
      fail_on_high:
        description: 'Fail build on high severity findings'
        required: false
        default: false
        type: boolean
      warning_only:
        description: 'Report vulnerabilities but never fail the build'
        required: false
        default: true
        type: boolean
      coverage_artifact:
        description: 'Optional: Name of coverage artifact from a prior job'
        required: false
        type: string
      run_garak:
        description: 'Explicitly run Garak LLM security probing (Layer 12)'
        required: false
        default: false
        type: boolean
      skip_garak:
        description: 'Skip Garak LLM security probing (Layer 12)'
        required: false
        default: false
        type: boolean
      garak_target_type:
        description: 'Garak generator type (e.g. test, openai, huggingface)'
        required: false
        default: 'openai'
        type: string
      garak_target_name:
        description: 'Garak target model name (e.g. gpt-4o-mini)'
        required: false
        default: 'gpt-4o-mini'
        type: string
      garak_probes:
        description: 'Comma-separated Garak probes or probe groups'
        required: false
        default: 'promptinject,dan,knownbadsignatures,encoding,continuation'
        type: string
      create_jira_tickets:
        description: 'Create JIRA tickets for critical and high severity findings'
        required: false
        default: false
        type: boolean
      jira_project_key:
        description: 'JIRA project key (e.g. SEC, INFRA)'
        required: false
        type: string
      jira_issue_type:
        description: 'JIRA issue type for created tickets'
        required: false
        default: 'Bug'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-scan:
    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
      issues: write
    uses: ./.github/workflows/epyon-scan.yml
    with:
      scan_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_mode || github.event_name == 'pull_request' && 'quick' || github.event_name == 'schedule' && 'nightly' || 'full' }}
      subdirectory: ${{ github.event_name == 'workflow_dispatch' && inputs.subdirectory || '' }}
      fail_on_critical: ${{ github.event_name != 'workflow_dispatch' && true || inputs.fail_on_critical != false }}
      fail_on_high: ${{ github.event_name != 'workflow_dispatch' && true || inputs.fail_on_high != false }}
      warning_only: ${{ github.event_name == 'workflow_dispatch' && inputs.warning_only == true || false }}
      coverage_artifact: ${{ inputs.coverage_artifact || '' }}
      run_garak: ${{ github.event_name == 'workflow_dispatch' && inputs.run_garak == true && 'true' || '' }}
      skip_garak: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_garak == true || false }}
      garak_target_type: ${{ inputs.garak_target_type || 'openai' }}
      garak_target_name: ${{ inputs.garak_target_name || 'gpt-4o-mini' }}
      garak_probes: ${{ inputs.garak_probes || 'promptinject,dan,knownbadsignatures,encoding,continuation' }}
      create_jira_tickets: ${{ inputs.create_jira_tickets || false }}
      jira_project_key: ${{ inputs.jira_project_key || '' }}
      jira_issue_type: ${{ inputs.jira_issue_type || 'Bug' }}
    secrets: inherit
