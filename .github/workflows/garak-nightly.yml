name: Nightly Garak Prompt Injection Scan

# Epyon nightly garak entrypoint.
# Runs NVIDIA garak prompt-injection probes against the configured LLM target every night.

permissions:
  contents: read

on:
  schedule:
    # Nightly run at 2 AM UTC
    - cron: '0 2 * * *'
  # checkov:skip=CKV_GHA_7:Workflow inputs control scan parameters not build artifacts
  workflow_dispatch:
    inputs:
      garak_target_type:
        description: 'Garak generator type (for example: test, openai, huggingface)'
        required: false
        default: 'openai'
        type: choice
        options:
          - openai
          - test
          - huggingface
          - ollama
          - litellm
      garak_target_name:
        description: 'Garak target model name preset'
        required: false
        default: 'gpt-4o-mini'
        type: choice
        options:
          - gpt-4o-mini
          - gpt-4.1-mini
          - gpt-4o
          - gpt-4.1
          - llama3.1:8b
          - test.Blank
          - test.Repeat
      garak_target_name_custom:
        description: 'Optional custom Garak target model name (overrides preset when set)'
        required: false
        type: string
      garak_probes:
        description: 'Garak probe set'
        required: false
        default: 'promptinject'
        type: choice
        options:
          - promptinject
          - dan
          - encoding
          - malwaregen
          - knownbadsignatures
          - xss
          - lmrc
          - all
      skip_garak:
        description: 'Skip Garak LLM security probing'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  garak-scan:
    name: Garak Prompt Injection Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          path: target-repo
          fetch-depth: 1

      - name: Checkout Epyon Security Scanner
        uses: actions/checkout@v4
        with:
          repository: MetroStar/epyon
          path: epyon
          fetch-depth: 1

      - name: Initialize Garak Scan
        id: init-scan
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          TARGET_NAME: ${{ github.event.repository.name }}
          GARAK_TARGET_TYPE_INPUT: ${{ github.event.inputs.garak_target_type }}
          GARAK_TARGET_NAME_INPUT: ${{ github.event.inputs.garak_target_name }}
          GARAK_TARGET_NAME_CUSTOM_INPUT: ${{ github.event.inputs.garak_target_name_custom }}
          GARAK_PROBES_INPUT: ${{ github.event.inputs.garak_probes }}
        run: |
          cd epyon

          TARGET_DIR="${{ github.workspace }}/target-repo"

          GARAK_TARGET_NAME_RESOLVED="${GARAK_TARGET_NAME_INPUT:-gpt-4o-mini}"
          if [[ -n "${GARAK_TARGET_NAME_CUSTOM_INPUT:-}" ]]; then
            GARAK_TARGET_NAME_RESOLVED="$GARAK_TARGET_NAME_CUSTOM_INPUT"
          fi

          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          USERNAME="${GITHUB_ACTOR}"
          SCAN_NAME="garak_${TARGET_NAME}_${USERNAME}_${TIMESTAMP}"
          SCAN_DIR="scans/${SCAN_NAME}"
          mkdir -p "$SCAN_DIR"

          echo "TARGET_DIR=$TARGET_DIR" > /tmp/epyon-env
          echo "TARGET_NAME=$TARGET_NAME" >> /tmp/epyon-env
          echo "GITHUB_ACTOR=$GITHUB_ACTOR" >> /tmp/epyon-env
          echo "GARAK_TARGET_TYPE=${GARAK_TARGET_TYPE_INPUT:-openai}" >> /tmp/epyon-env
          echo "GARAK_TARGET_NAME=$GARAK_TARGET_NAME_RESOLVED" >> /tmp/epyon-env
          echo "GARAK_PROBES=${GARAK_PROBES_INPUT:-promptinject}" >> /tmp/epyon-env
          echo "SCAN_DIR=$PWD/$SCAN_DIR" >> /tmp/epyon-env
          echo "SCAN_NAME=$SCAN_NAME" >> /tmp/epyon-env

          echo "scan_dir=$SCAN_DIR" >> $GITHUB_OUTPUT
          echo "scan_id=$SCAN_NAME" >> $GITHUB_OUTPUT
          echo "✅ Initialized garak scan: ${SCAN_NAME}"

      - name: Layer 12 - LLM Security (Garak)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_garak != 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          source /tmp/epyon-env
          cd epyon
          echo "🤖 Layer 12: LLM Security (Garak)"
          chmod +x scripts/shell/run-garak-scan.sh

          GARAK_TARGET_TYPE_RESOLVED="${GARAK_TARGET_TYPE:-openai}"
          GARAK_TARGET_NAME_RESOLVED="${GARAK_TARGET_NAME:-gpt-4o-mini}"

          case "${GARAK_TARGET_TYPE_RESOLVED,,}" in
            openai)
              if [[ -z "${OPENAI_API_KEY:-}" ]]; then
                echo "⚠️ OPENAI_API_KEY not available; falling back to Garak test.Blank"
                GARAK_TARGET_TYPE_RESOLVED="test"
                GARAK_TARGET_NAME_RESOLVED="test.Blank"
              fi
              ;;
            anthropic)
              if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
                echo "⚠️ ANTHROPIC_API_KEY not available; falling back to Garak test.Blank"
                GARAK_TARGET_TYPE_RESOLVED="test"
                GARAK_TARGET_NAME_RESOLVED="test.Blank"
              fi
              ;;
          esac

          SCAN_DIR="$SCAN_DIR" TARGET_DIR="${TARGET_DIR}" \
            GARAK_TARGET_TYPE="${GARAK_TARGET_TYPE_RESOLVED}" \
            GARAK_TARGET_NAME="${GARAK_TARGET_NAME_RESOLVED}" \
            GARAK_PROBES="${GARAK_PROBES}" \
            ./scripts/shell/run-garak-scan.sh || echo "Garak scan completed with warnings"

      - name: Upload Garak Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.init-scan.outputs.scan_id }}
          path: epyon/${{ steps.init-scan.outputs.scan_dir }}/
          retention-days: 30

      - name: Generate Summary
        if: always()
        run: |
          source /tmp/epyon-env
          cd epyon
          SCAN_DIR="${{ steps.init-scan.outputs.scan_dir }}"

          echo "## 🤖 Nightly Garak Prompt Injection Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          GARAK_RESULTS_FILE="$SCAN_DIR/garak/garak-results.json"
          echo "### Garak Results" >> $GITHUB_STEP_SUMMARY
          if [ -f "$GARAK_RESULTS_FILE" ]; then
            GARAK_STATUS=$(jq -r '.status // "unknown"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "unknown")
            GARAK_TARGET_TYPE=$(jq -r '.target_type // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_TARGET_NAME=$(jq -r '.target_name // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_PROBES_USED=$(jq -r '.probes // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_EXIT_CODE=$(jq -r '.exit_code // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_HIT_LOG=$(jq -r '.hit_log // empty' "$GARAK_RESULTS_FILE" 2>/dev/null || true)
            GARAK_HIT_COUNT="0"
            if [ -n "$GARAK_HIT_LOG" ] && [ -f "$SCAN_DIR/garak/$GARAK_HIT_LOG" ]; then
              GARAK_HIT_COUNT=$(wc -l < "$SCAN_DIR/garak/$GARAK_HIT_LOG" | tr -d '[:space:]')
            fi
            echo "- Status: \`$GARAK_STATUS\`" >> $GITHUB_STEP_SUMMARY
            echo "- Target: \`$GARAK_TARGET_TYPE\` / \`$GARAK_TARGET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- Probes: \`$GARAK_PROBES_USED\`" >> $GITHUB_STEP_SUMMARY
            echo "- Probe hits: \`$GARAK_HIT_COUNT\`" >> $GITHUB_STEP_SUMMARY
            echo "- Exit code: \`$GARAK_EXIT_CODE\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Garak results were not generated in this run." >> $GITHUB_STEP_SUMMARY
          fi
