name: epyon

services:
  epyon-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: epyon-web:latest
    container_name: epyon-web
    restart: unless-stopped
    ports:
      - "${EPYON_PORT:-8057}:8057"
    environment:
      HOST: 0.0.0.0
      PORT: 8057
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_USER_EMAIL: ${JIRA_USER_EMAIL:-}
      GH_PAT: ${GH_PAT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL_DOCKER:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      # "Run New Scan" -> "Upload .zip" limits (POST /api/scans/upload).
      # Defaults (500MB / 2048MB) are decompression-bomb/DoS guards; raise
      # them via .env if you need to upload larger projects.
      EPYON_MAX_UPLOAD_MB: ${EPYON_MAX_UPLOAD_MB:-500}
      EPYON_MAX_UPLOAD_UNZIPPED_MB: ${EPYON_MAX_UPLOAD_UNZIPPED_MB:-2048}
      # Absolute host path of this checkout. Required so scan layers that
      # spawn sibling containers via the shared docker.sock (Syft, Trivy,
      # Checkov, Grype/Anchore, Safety) can translate a container-side path
      # (e.g. /app/tmp/clone-<job>) to the equivalent HOST path before
      # passing it to `docker run -v`, since bind-mount sources are always
      # resolved by the host daemon against the host filesystem. Without
      # this, web UI-triggered scans of cloned repos silently scan an
      # empty directory and report a false "clean" result. Defaults to
      # ${PWD} at `docker compose up` time — override only if that isn't
      # this checkout's real absolute host path (e.g. a symlinked deploy dir).
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-${PWD}}
    volumes:
      # Docker-outside-of-docker: scan layers are spawned as sibling
      # containers on the host engine, not nested inside this container.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist scan results, app config, and STIG state across rebuilds.
      - ./scans:/app/scans
      - ./configuration:/app/configuration
      - ./web/data:/app/web/data
      - ./.epyon-ignore.yml:/app/.epyon-ignore.yml:ro
      # Host-share the web UI's per-job clone workspace too — sibling scan
      # containers (see HOST_PROJECT_DIR above) need a real host path to
      # bind-mount, and /app/tmp has no host equivalent without this.
      - ./tmp:/app/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
