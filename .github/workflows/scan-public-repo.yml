name: Scan Public Repository

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Git repository URL to scan'
        required: true
        type: string
      scan_mode:
        description: 'Scan mode'
        required: false
        default: 'full'
        type: choice
        options:
          - quick
          - full
          - baseline
      fail_on_critical:
        description: 'Fail build on critical severity findings'
        required: false
        default: false
        type: boolean
      fail_on_high:
        description: 'Fail build on high severity findings'
        required: false
        default: false
        type: boolean

jobs:
  external-scan:
    name: Scan External Repository
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Epyon
        uses: actions/checkout@v4
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Docker Images
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-
      
      - name: Pull Security Tool Images
        run: |
          docker pull anchore/grype:latest &
          docker pull aquasec/trivy:latest &
          docker pull trufflesecurity/trufflehog:latest &
          docker pull anchore/syft:latest &
          wait
          echo "All security tool images cached"
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-pip
          pip3 install pyyaml
      
      - name: Run Epyon Security Scan on External Repo
        id: scan
        env:
          GIT_TERMINAL_PROMPT: 0
          GITHUB_ACTOR: ${{ github.actor }}
          TARGET_NAME: ${{ github.event.inputs.repository }}
        run: |
          chmod +x scripts/shell/run-target-security-scan.sh
          ./scripts/shell/run-target-security-scan.sh "${{ github.event.inputs.repository }}" "${{ github.event.inputs.scan_mode }}"
        continue-on-error: true
      
      - name: Find Scan Directory
        id: find-scan
        run: |
          SCAN_DIR=$(ls -td scans/*/ 2>/dev/null | head -1 | sed 's:/$::')
          echo "scan_dir=$SCAN_DIR" >> $GITHUB_OUTPUT
      
      - name: Debug Scan Directory
        run: |
          SCAN_DIR="${{ steps.find-scan.outputs.scan_dir }}"
          echo "Scan directory: $SCAN_DIR"
          echo "Contents:"
          ls -la "$SCAN_DIR" || echo "Directory not found"
          echo "Subdirectories:"
          find "$SCAN_DIR" -type f -name "*.json" | head -20 || echo "No files found"
      
      - name: Check Severity Gate
        id: severity-gate
        env:
          SCAN_DIR: ${{ github.workspace }}/${{ steps.find-scan.outputs.scan_dir }}
          FAIL_ON_CRITICAL: ${{ github.event.inputs.fail_on_critical == 'true' }}
          FAIL_ON_HIGH: ${{ github.event.inputs.fail_on_high == 'true' }}
        run: |
          chmod +x scripts/shell/check-severity-gate.sh
          ./scripts/shell/check-severity-gate.sh
      
      - name: Fix Artifact Permissions
        if: always()
        run: |
          SCAN_DIR="${{ steps.find-scan.outputs.scan_dir }}"
          if [ -d "$SCAN_DIR" ]; then
            echo "Fixing permissions for: $SCAN_DIR"
            # Change ownership to runner user first
            sudo chown -R runner:docker "$SCAN_DIR" || true
            # Then fix permissions
            sudo chmod -R a+r "$SCAN_DIR" || true
            sudo find "$SCAN_DIR" -type d -exec chmod a+rx {} \; || true
            # Verify permissions
            ls -la "$SCAN_DIR/clamav/" || true
          fi
      
      - name: Upload All Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-repo-security-scan-complete
          path: ${{ steps.find-scan.outputs.scan_dir }}/
          retention-days: 90
      
      - name: Upload Security Dashboard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-dashboard
          path: |
            ${{ steps.find-scan.outputs.scan_dir }}/consolidated-reports/dashboards/
            ${{ steps.find-scan.outputs.scan_dir }}/consolidated-reports/index.html
          retention-days: 90
      
      - name: Upload HTML Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-html
          path: ${{ steps.find-scan.outputs.scan_dir }}/consolidated-reports/html-reports/
          retention-days: 90
      
      - name: Upload Markdown Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-markdown
          path: ${{ steps.find-scan.outputs.scan_dir }}/consolidated-reports/markdown-reports/
          retention-days: 90
      
      - name: Upload CSV Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-csv
          path: ${{ steps.find-scan.outputs.scan_dir }}/consolidated-reports/csv-reports/
          retention-days: 90
      
      - name: Upload Raw Data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-raw-data
          path: ${{ steps.find-scan.outputs.scan_dir }}/consolidated-reports/raw-data/
          retention-days: 90
      
      - name: Generate Summary
        if: always()
        run: |
          SCAN_DIR="${{ steps.find-scan.outputs.scan_dir }}"
          echo "## 🛡️ Security Scan Results for External Repository" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ github.event.inputs.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Mode:** \`${{ github.event.inputs.scan_mode }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md" ]; then
            cat "$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md" >> $GITHUB_STEP_SUMMARY
          fi
